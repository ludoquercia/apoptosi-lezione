      gg.fillStyle = f < .55 ? '#14283a' : '#1b3a3a';
      gg.fillRect(0,i,LARG,1);
    }
    for (var s=0;s<40;s++){
      var x = (s*97 % LARG), y = ((s*57) % 90);
      gg.fillStyle = (s + Math.floor(t/30)) % 5 === 0 ? '#5fb3ad' : '#2b4a5a';
      gg.fillRect(x,y,1,1);
    }
    // collina
    gg.fillStyle = '#1d4a2e'; gg.fillRect(0,140,LARG,ALT-140);
    gg.fillStyle = '#2f7d43'; gg.fillRect(0,146,LARG,ALT-146);
    for (var k=0;k<70;k++) gg.fillRect((k*37)%LARG, 150+((k*23)%50), 1, 1);

    // titolo
    var tit = 'BIOQUEST';
    var w = FONT.misura(tit);
    for (var sc=0; sc<3; sc++){}
    gg.save();
    gg.translate((LARG - w*3)/2, 34);
    gg.scale(3,3);
    FONT.scrivi(gg, tit, 1, 1, '#0b1018');
    FONT.scrivi(gg, tit, 0, 0, C.ambra);
    gg.restore();

    var sot = 'Biologia — semestre aperto';
    FONT.scrivi(gg, sot, (LARG - FONT.misura(sot))/2, 66, C.tealC);

    var u7 = 'Unità 7 · Il controllo della proliferazione';
    var u7b = 'e della sopravvivenza cellulare';
    FONT.scrivi(gg, u7,  (LARG - FONT.misura(u7))/2,  84, C.quasi);
    FONT.scrivi(gg, u7b, (LARG - FONT.misura(u7b))/2, 94, C.quasi);

    // cellula che pulsa
    var r = 13 + Math.sin(t/26)*1.6;
    gg.fillStyle = C.tealS;
    gg.beginPath(); gg.arc(LARG/2, 126, r+2, 0, 6.2832); gg.fill();
    gg.fillStyle = C.teal;
    gg.beginPath(); gg.arc(LARG/2, 126, r, 0, 6.2832); gg.fill();
    gg.fillStyle = C.tealC;
    gg.beginPath(); gg.arc(LARG/2 - 2, 124, r/2.4, 0, 6.2832); gg.fill();

    UI.box(gg, 60, 162, 200, 26, C.carta);
    var msg = Gioco.save && Gioco.save.pos ? 'Premi A per riprendere' : 'Premi A per cominciare';
    FONT.scrivi(gg, msg, (LARG - FONT.misura(msg))/2, 170, C.ink);
    if (Math.floor(t/24) % 2 === 0)
      FONT.scrivi(gg, '▼', LARG/2 - 2, 180, C.ambraS);

    Input.azzeraAree();
    Input.area('gioca', 60, 162, 200, 26);

    var pie = Save.disponibile ? 'Frecce o WASD per muoverti · A per parlare'
                               : 'Qui il progresso non si salva: usa il codice di ripresa';
    gg.fillStyle = 'rgba(15,20,32,.55)'; gg.fillRect(0, ALT-16, LARG, 16);
    FONT.scrivi(gg, pie, (LARG - FONT.misura(pie))/2, ALT-12, Save.disponibile ? '#9fb0c6' : C.ambraC);
  }
};

/* ══════════════════════════════════════════════════════════════════
   12-bis. BÌOS — il personaggio che è la biologia
   ══════════════════════════════════════════════════════════════════
   Accoglie il giocatore, dice chi è e a cosa serve: allenarlo a
   superare il boss vero, che non sta dentro il gioco. */

var INTRO_BIOS = [
  'Ah. Sei arrivato.',
  'Mi chiamo Bìos. In greco vuol dire «vita»: è l\'unica parola che mi descriva per intero.',
  'Non sono un professore. Sono la materia: tutto quello che dentro di te nasce, si divide e a un certo punto decide di finire.',
  'Fra qualche mese ti aspetta una prova che qui chiamiamo il Semestre Filtro. È il boss finale, e non è in questo giardino: è fuori, nel mondo vero.',
  'Non ti chiederà di ricordare. Ti chiederà di capire. Sono due cose diverse, e solo una si può allenare in fretta.',
  'Io non posso passarlo al posto tuo. Posso fare l\'altra cosa: allenarti.',
  'Questo è il Giardino del Ciclo, la settima unità del programma. Quattro esaminatori lungo il sentiero, e un Professore in fondo.',
  'Ogni concetto che capisci diventa una carta. Le carte sono le tue abilità: quando l\'album è pieno, quell\'unità non ti fa più paura.',
  'Una regola sola, ed è la più importante: qui si impara sbagliando. Ogni risposta sbagliata ti spiega perché è sbagliata. Non evitare gli errori. Usali.',
  'Il primo esaminatore è più avanti, lungo il sentiero. Vai: ti guardo da qui.'
];

function consiglioBios(){
  var u = Gioco.unita;
  var fatte = Gioco.missioniFatte(u), tot = (u.missioni||[]).length;
  var carte = Gioco.carteAvute(), tutte = Gioco.carteTotali();
  var r = [];
  if (Gioco.save.medaglie[u.id]){
    r.push('Hai la medaglia. Questa unità non ti fa più paura, ed è esattamente quello che serviva.');
    r.push('Le altre sei zone del programma sono ancora chiuse: arriveranno. Nel frattempo l\'erba alta serve a non dimenticare.');
  } else if (fatte === 0){
    r.push('Il primo esaminatore è più avanti, lungo il sentiero. Non ti farà passare il cancello finché non avrete parlato.');
    r.push('Ricorda la regola: qui si impara sbagliando. Una risposta sbagliata non ti punisce, ti spiega.');
  } else if (fatte < tot){
    r.push('Ne hai superate ' + fatte + ' su ' + tot + '. Il prossimo cancello si apre quando superi l\'esaminatore che lo precede.');
    r.push('Se una domanda ti ha messo in difficoltà, torna nell\'erba alta: lì ripescano proprio quelle che hai sbagliato.');
  } else {
    r.push('Quattro su quattro. Il Professore ti aspetta in fondo al giardino.');
    r.push('Non chiede definizioni: chiede di mettere insieme i pezzi. È il ripasso più utile che farai.');
  }
  r.push('Carte conquistate: ' + carte + ' su ' + tutte + '. Programma coperto: ' +
         Math.round(Gioco.percentuale()*100) + '%.');
  return r;
}

var scenaIntro = {
  entra: function(){
    this.i = 0; this.t = 0;
    this.pag = 0; this.car = 0;
    this.impagina();
  },
  impagina: function(){
    this.pagine = FONT.pagine(INTRO_BIOS[this.i], LARG - 44, 3);
    this.pag = 0; this.car = 0;
  },
  agg: function(){
    this.t++;
    var tot = (this.pagine[this.pag]||[]).join('\n').length;
    if (this.car < tot) this.car += 2;
  },
  input: function(){
    if (!(Input.premuto('a') || Input.tap() === 'avanti')) return;
    var tot = (this.pagine[this.pag]||[]).join('\n').length;
    if (this.car < tot){ this.car = tot; return; }
    if (this.pag < this.pagine.length - 1){ this.pag++; this.car = 0; return; }
    this.i++;
    if (this.i >= INTRO_BIOS.length){ Scene.sostituisci(scenaOverworld); return; }
    this.impagina();
  },
  dis: function(gg){
    var t = this.t;
    var gr = gg.createLinearGradient(0,0,0,ALT);
    gr.addColorStop(0,'#0b1f24'); gr.addColorStop(1,'#123437');
    gg.fillStyle = gr; gg.fillRect(0,0,LARG,ALT);

    // Due filamenti che si avvolgono: la vita che si copia.
    gg.save();
    for (var y=0;y<160;y+=2.2){
      var f = (y + t*0.6) * 0.07;
      var dd = Math.sin(f) * 48;
      var vicino = Math.cos(f) > 0;
      if (y % 13 < 2.2){
        gg.strokeStyle = 'rgba(228,175,110,.16)'; gg.lineWidth = 1.1;
        gg.beginPath();
        gg.moveTo(LARG/2 - dd, y); gg.lineTo(LARG/2 + dd, y); gg.stroke();
      }
      var r1 = vicino ? 2.3 : 1.5, r2 = vicino ? 1.5 : 2.3;
      gg.fillStyle = vicino ? 'rgba(120,225,160,.34)' : 'rgba(60,150,145,.24)';
      ovale(gg, LARG/2 + dd, y, r1, r1); gg.fill();
      gg.fillStyle = vicino ? 'rgba(60,150,145,.24)' : 'rgba(120,225,160,.34)';
      ovale(gg, LARG/2 - dd, y, r2, r2); gg.fill();
    }
    gg.restore();

    // Bìos, in grande.
    var salto = Math.sin(t/34) * 2;
    var bx = (LARG - 48)/2, by = 46 + salto;
    gg.save();
    gg.translate(bx + 24, by + 74); gg.scale(1,0.3);
    gg.fillStyle = 'rgba(0,0,0,.34)';
    gg.beginPath(); gg.arc(0,0,22,0,6.2832); gg.fill();
    gg.restore();
    gg.drawImage(attore('bios').giu[0], bx, by, 48, 72);

    disegnaFumetto(gg, 'Bìos', this.pagine[this.pag] || [], this.car);
    Input.azzeraAree();
    Input.area('avanti', 0, 0, LARG, ALT);
  }
};

/* ══════════════════════════════════════════════════════════════════
   13. SCENA: OVERWORLD
   ══════════════════════════════════════════════════════════════════ */

var camX = 0, camY = 0;

var scenaOverworld = {
  entra: function(){
    var p = Gioco.player;
    apriCancelli(Gioco.missioniFatte(Gioco.unita));
    var lib = cellaLibera(p.tx, p.ty);
    p.tx = lib.tx; p.ty = lib.ty; p.passo = 0; p.dirPasso = null;
    this.inquadra(true);
    this.avviso = null; this.avvisoT = 0;
  },

  // Scostamento in pixel del passo in corso: la camera e lo sprite
  // devono usare lo stesso numero, altrimenti il personaggio "nuota".
  scostamento: function(){
    var p = Gioco.player;
    if (!p.dirPasso) return [0,0];
    var q = p.passo / PASSO;
    var d = DIR[p.dirPasso];
    return [ d[0]*q*TILE, d[1]*q*TILE ];
  },

  inquadra: function(){
    var p = Gioco.player, o = this.scostamento();
    camX = clamp(p.tx*TILE + TILE/2 + o[0] - LARG/2, 0, Math.max(0, Mondo.larg*TILE - LARG));
    camY = clamp(p.ty*TILE + TILE/2 + o[1] - ALT/2,  0, Math.max(0, Mondo.alt*TILE - ALT));
  },

  agg: function(){
    var p = Gioco.player;
    if (this.avvisoT > 0) this.avvisoT--;

    if (p.dirPasso){
      p.passo++;
      if (p.passo >= PASSO){
        var d = DIR[p.dirPasso];
        p.tx += d[0]; p.ty += d[1];
        p.passo = 0; p.dirPasso = null;
        p.frame = p.frame === 1 ? 2 : 1;
        Gioco.passiDaIncontro++;
        this.dopoPasso();
      }
    } else {
      var dir = Input.direzione();
      if (dir){
        p.dir = dir;
        var d2 = DIR[dir];
        var nx = p.tx + d2[0], ny = p.ty + d2[1];
        var occupante = this.npcIn(nx, ny);
        if (occupante){
          this.sfida(occupante);
        } else if (!solidoIn(nx, ny)){
          p.dirPasso = dir; p.passo = 0;
        } else {
          this.bloccato(nx, ny);
          p.frame = 0;
        }
      } else {
        p.frame = 0;
      }
    }
    this.inquadra();
  },

  dopoPasso: function(){
    var p = Gioco.player;

    // Come nelle palestre di Pokémon: se ti avvicini a un esaminatore che
    // non hai ancora superato, ti ferma lui. Senza questo si può girargli
    // intorno lungo il sentiero e arrivare al cancello senza aver parlato.
    var vicino = this.esaminatoreVicino();
    if (vicino){ this.sfida(vicino); return; }

    // Erba dello studio: ripasso a sorpresa, con un minimo di tregua
    if (caselleIn(p.tx, p.ty) === 'E' && Gioco.passiDaIncontro > 4){
      if (Math.random() < 0.16){
        var d = this.domandaDaRipassare();
        if (d){
          Gioco.passiDaIncontro = 0;
          Scene.push(scenaBattaglia, {
            tipo:'ripasso', titolo:'Ripasso', nome:'Dubbio improvviso',
            veste:'npc3', domande:[d],
            intro:['Un dubbio ti prende in mezzo all\'erba alta.'],
            vittoria:['Chiarito. Vai pure.'],
            sconfitta:['Rileggi con calma: è così che si impara.']
          });
        }
      }
    }
    if (Gioco.tempo % 40 === 0) Gioco.salva();
  },

  // Cascata di ripiego: prima quelle sbagliate, poi quelle viste,
  // poi qualunque domanda di una missione già affrontata. Se non c'è
  // niente (inizio partita) l'erba non innesca nulla.
  domandaDaRipassare: function(){
    var u = Gioco.unita, s = Gioco.save;
    var sbagliate = [], viste = [], tutte = [];
    (u.missioni||[]).forEach(function(m){
      if (!s.missioni[m.id] && !(m.domande||[]).some(function(d){ return s.viste[d.id]; })) return;
      (m.domande||[]).forEach(function(d){
        tutte.push(d);
        if (s.sbagliate[d.id]) sbagliate.push(d);
        else if (s.viste[d.id]) viste.push(d);
      });
    });
    var pool = sbagliate.length ? sbagliate : (viste.length ? viste : tutte);
    if (!pool.length) return null;
    return pool[(Math.random()*pool.length)|0];
  },

  esaminatoreVicino: function(){
    var p = Gioco.player, u = Gioco.unita;
    var lati = [[0,-1],[0,1],[-1,0],[1,0]];
    for (var i=0;i<lati.length;i++){
      var n = this.npcIn(p.tx + lati[i][0], p.ty + lati[i][1]);
      if (!n || n.tipo !== 'missione') continue;
      if (Gioco.save.missioni[u.missioni[n.indice].id]) continue;   // già superata
      return n;
    }
    return null;
  },

  npcIn: function(tx,ty){
    for (var i=0;i<Mondo.npc.length;i++){
      var n = Mondo.npc[i];
      if (n.tx===tx && n.ty===ty) return n;
    }
    return null;
  },

  bloccato: function(nx,ny){
    var ch = caselleIn(nx,ny);
    if (ch === 'X'){
      var cancello = null;
      for (var i=0;i<Mondo.cancelli.length;i++)
        if (Mondo.cancelli[i].tx===nx && Mondo.cancelli[i].ty===ny) cancello = Mondo.cancelli[i];
      var miss = Gioco.unita.missioni[cancello ? cancello.missione : 0];
      this.avviso = 'Chiuso. Supera «' + (miss ? miss.titolo : 'la missione') + '» per passare.';
      this.avvisoT = 150;
    } else if (ch === 'C'){
      Scene.push(scenaDialogo, {
        righe:[ Gioco.unita.cartello || Gioco.unita.titolo ],
        nome:'Cartello'
      });
    } else if (ch === 'B'){
      this.avviso = 'Una siepe fitta. Di là non si passa.';
      this.avvisoT = 90;
    }
  },

  sfida: function(n){
    var u = Gioco.unita;
    if (n.tipo === 'guida'){
      Scene.push(scenaDialogo, { nome:'Bìos', righe: consiglioBios() });
      return;
    }
    if (n.tipo === 'missione'){
      var m = u.missioni[n.indice];
      var fatta = !!Gioco.save.missioni[m.id];
      Scene.push(scenaBattaglia, {
        tipo:'missione', idMissione:m.id, titolo:m.titolo, nome:n.nome, veste:n.veste,
        domande:m.domande, cartaBonus:m.cartaBonus,
        intro: fatta ? ['Bentornato. Vuoi riprovare? Le carte ce le hai già.'] : (m.intro||[]),
        vittoria:m.vittoria||[], sconfitta:m.sconfitta||[],
        ripetizione: fatta
      });
    } else {
      if (!Gioco.tutteFatte(u)){
        Scene.push(scenaDialogo, {
          nome:u.boss.nome,
          righe:['Non così in fretta. Prima supera le quattro missioni del giardino.',
                 'Ti aspetto qui: non ho fretta, io.']
        });
        return;
      }
      Scene.push(scenaBattaglia, {
        tipo:'boss', idMissione:'boss:'+u.id, titolo:'Esame finale',
        nome:u.boss.nome, veste:'prof',
        domande:u.boss.domande,
        intro:u.boss.intro||[], vittoria:u.boss.vittoria||[], sconfitta:u.boss.sconfitta||[],
        ripetizione: !!Gioco.save.medaglie[u.id]
      });
    }
  },

  input: function(){
    if (Input.premuto('album')) { Scene.push(scenaAlbum); return; }
    if (Input.premuto('mappa')) { Scene.push(scenaMappa); return; }
    var t = Input.tap();
    if (t === 'album') { Scene.push(scenaAlbum); return; }
    if (t === 'mappa') { Scene.push(scenaMappa); return; }
    if (Input.premuto('a')){
      var p = Gioco.player;
      var d = DIR[p.dir];
      var n = this.npcIn(p.tx+d[0], p.ty+d[1]);
      if (n) this.sfida(n);
      else this.bloccato(p.tx+d[0], p.ty+d[1]);
    }
  },

  torna: function(){
    apriCancelli(Gioco.missioniFatte(Gioco.unita));
    Gioco.salva();
    // Medaglia appena conquistata?
    var u = Gioco.unita;
    if (Gioco.save.medaglie[u.id] && !this.medagliaMostrata){
      this.medagliaMostrata = true;
      Scene.push(scenaMedaglia, u);
    }
  },

  dis: function(gg){
    var p = Gioco.player;
    var o = this.scostamento(), offx = o[0], offy = o[1];

    var cx = camX, cy = camY;
    gg.fillStyle = '#26331f'; gg.fillRect(0,0,LARG,ALT);

    // Terreno: si disegnano soltanto le caselle inquadrate, prendendole
    // già pronte dal set. L'acqua si anima da sola perché il fotogramma
    // dipende dal tempo di gioco.
    var cas = Mondo.caselle;
    var tx0 = Math.max(0, Math.floor(cx/TILE)), tx1 = Math.min(Mondo.larg-1, Math.floor((cx+LARG)/TILE));
    var ty0 = Math.max(0, Math.floor(cy/TILE)), ty1 = Math.min(Mondo.alt-1, Math.floor((cy+ALT)/TILE));
    for (var ty=ty0; ty<=ty1; ty++){
      for (var tx=tx0; tx<=tx1; tx++){
        var px = tx*TILE - cx, py = ty*TILE - cy;
        var ch = Mondo.griglia[ty].charAt(tx);
        var nome = CASELLA_DI[ch] || 'erba';
        var dx0 = px - SBAVA, dy0 = py - SBAVA, dd = TILE + SBAVA*2;
        if (nome === 'roccia' || nome === 'piazzola' || nome === 'fiori'){
          gg.drawImage(cas.erba1, dx0, dy0, dd, dd);
        }
        gg.drawImage(casellaIn(tx,ty), dx0, dy0, dd, dd);
        var b = Mondo.bordi[ty*Mondo.larg+tx];
        if (b){
          if (b & 1) gg.drawImage(cas.bordo.su,  dx0, dy0, dd, dd);
          if (b & 2) gg.drawImage(cas.bordo.giu, dx0, dy0, dd, dd);
          if (b & 4) gg.drawImage(cas.bordo.sx,  dx0, dy0, dd, dd);
          if (b & 8) gg.drawImage(cas.bordo.dx,  dx0, dy0, dd, dd);
        }
      }
    }

    // Personaggi e oggetti alti, ordinati per profondità: chi ha la base
    // più in basso viene disegnato dopo, così si passa dietro agli alberi.
    var sporgenza = PERS_A - TILE;
    var attori = [];
    Mondo.alti.forEach(function(o){
      var d = Mondo.disegniAlti[o.tipo];
      attori.push({ y:o.ty*TILE, x:o.tx*TILE, img:d.img, dx:d.dx, dy:d.dy,
                    larg:d.w, alt:d.h, oggetto:true });
    });
    Mondo.npc.forEach(function(n){
      attori.push({ y:n.ty*TILE, x:n.tx*TILE, img: attore(n.veste)[n.dir][0], npc:n });
    });
    attori.push({
      y: p.ty*TILE + offy, x: p.tx*TILE + offx,
      img: attore('eroe')[p.dir][p.dirPasso ? (p.passo < PASSO/2 ? (p.frame||1) : (p.frame===1?2:1)) : 0]
    });
    attori.sort(function(a,b){ return a.y - b.y; });

    attori.forEach(function(a){
      var lg = a.oggetto ? a.larg : PERS_L, al = a.oggetto ? a.alt : PERS_A;
      var sx = (a.x - cx) + (a.dx || 0);
      var sy = (a.y - cy) + (a.oggetto ? a.dy : -sporgenza);
      if (sx < -lg || sy < -al || sx > LARG || sy > ALT) return;
      gg.drawImage(a.img, sx, sy, lg, al);
      if (a.npc && a.npc.tipo !== 'guida'){
        // Fumettino di richiamo finché quella prova non è superata.
        var fatto = a.npc.tipo === 'missione'
          ? !!Gioco.save.missioni[Gioco.unita.missioni[a.npc.indice].id]
          : !!Gioco.save.medaglie[Gioco.unita.id];
        if (!fatto){
          // fumetto di richiamo, con la codina verso il personaggio
          var salto = Math.abs(Math.sin(Gioco.tempo/14)) * 1.5;
          var bx = sx + TILE/2, by = sy - 8.5 - salto;
          gg.save();
          gg.fillStyle = '#fff7dd';
          gg.strokeStyle = '#a8791a'; gg.lineWidth = 0.7;
          ovale(gg, bx, by, 4.6, 4.2); gg.fill(); gg.stroke();
          gg.beginPath();
          gg.moveTo(bx-1.6, by+3.2); gg.lineTo(bx, by+6.4); gg.lineTo(bx+1.6, by+3.2);
          gg.closePath(); gg.fill();
          gg.fillStyle = '#c0392b';
          arrotondato(gg, bx-0.6, by-2.4, 1.2, 3.1, 0.6); gg.fill();
          ovale(gg, bx, by+2.1, 0.65, 0.65); gg.fill();
          gg.restore();
        }
      }
    });

    // Erba dello studio in primo piano: il personaggio ci sparisce dentro
    // fino alla vita. Si ridisegna solo la parte inquadrata.
    for (var ey=ty0; ey<=ty1; ey++) for (var ex=tx0; ex<=tx1; ex++){
      if (Mondo.griglia[ey].charAt(ex) !== 'E') continue;
      gg.drawImage(cas.erbaAlta, 0, cas.erbaAlta.height*0.42,
                   cas.erbaAlta.width, cas.erbaAlta.height*0.58,
                   ex*TILE - cx, ey*TILE - cy + TILE*0.42, TILE, TILE*0.58);
    }

    scenaOverworld.hud(gg);

    if (this.avvisoT > 0 && this.avviso){
      var righe = FONT.spezza(this.avviso, LARG-40);
      var h = righe.length*9 + 14;
      UI.box(gg, 12, ALT-h-10, LARG-24, h, C.carta);
      righe.forEach(function(r,i){
        FONT.scrivi(gg, r, 22, ALT-h-10+7+i*9, C.ink);
      });
    }
  },

  hud: function(gg){
    var u = Gioco.unita;
    // Targhetta della zona, in alto a sinistra, come l'insegna che
    // compare entrando in una città.
    var titolo = 'U' + u.numero + ' · ' + u.zona;
    var fatte = Gioco.missioniFatte(u), tot = (u.missioni||[]).length;
    var s = fatte + '/' + tot + ' missioni';
    var wT = Math.max(FONT.misura(titolo), FONT.misura(s) + 34) + 16;
    UI.box(gg, 4, 3, wT, 30);
    FONT.scrivi(gg, titolo, 11, 7, UIC.testo);
    FONT.scrivi(gg, s, 11, 20, UIC.testoTenue);
    UI.barra(gg, 11 + FONT.misura(s) + 6, 21, wT - FONT.misura(s) - 30, 3,
             Gioco.percentuale(), '#5aa8e0', '#5a6068');

    // tasti album/mappa in basso a destra
    var wA = FONT.misura('ALBUM') + 12, wM = FONT.misura('MAPPA') + 12;
    var xM = LARG - wM - 4, xA = xM - wA - 4, yB = ALT - 20;
    UI.box(gg, xA, yB, wA, 17);
    FONT.scrivi(gg, 'ALBUM', xA + 6, yB + 5, UIC.testo);
    UI.box(gg, xM, yB, wM, 17);
    FONT.scrivi(gg, 'MAPPA', xM + 6, yB + 5, UIC.testo);
    Input.azzeraAree();
    Input.area('album', xA, yB, wA, 17);
    Input.area('mappa', xM, yB, wM, 17);
  }
};

/* ══════════════════════════════════════════════════════════════════
   14. SCENA: DIALOGO
   ══════════════════════════════════════════════════════════════════ */

var scenaDialogo = {
  entra: function(arg){
    this.righe = (arg.righe || []).slice();
    this.nome = arg.nome || '';
    this.i = 0; this.car = 0; this.pag = 0;
    this.preparaPagine();
  },
  preparaPagine: function(){
    var t = this.righe[this.i] || '';
    this.pagine = FONT.pagine(t, LARG - 44, 3);
    this.pag = 0; this.car = 0;
  },
  testoPagina: function(){ return (this.pagine[this.pag] || []).join('\n'); },
  agg: function(){
    var tot = this.testoPagina().length;
    if (this.car < tot) this.car += 2;
  },
  input: function(){
    if (!(Input.premuto('a') || Input.tap() === 'avanti')) return;
    var tot = this.testoPagina().length;
    if (this.car < tot){ this.car = tot; return; }
    if (this.pag < this.pagine.length - 1){ this.pag++; this.car = 0; return; }
    this.i++;
    if (this.i >= this.righe.length){ Scene.pop(); return; }
    this.preparaPagine();
  },
  dis: function(gg){
    var sotto = Scene.pila[Scene.pila.length-2];
    if (sotto && sotto.dis) sotto.dis(gg);
    gg.fillStyle = 'rgba(15,20,32,.35)'; gg.fillRect(0,0,LARG,ALT);
    disegnaFumetto(gg, this.nome, this.pagine[this.pag] || [], this.car);
    Input.azzeraAree();
    Input.area('avanti', 0, 0, LARG, ALT);
  }
};

// Il riquadro del parlato, sempre nello stesso posto: in basso.
function disegnaFumetto(gg, nome, righe, caratteri){
  var h = 56, y = ALT - h - 5;
  UI.box(gg, 5, y, LARG-10, h);
  // filo interno colorato: è il dettaglio che distingue la finestra di
  // dialogo di una console da un semplice rettangolo bianco
  arrotondato(gg, 8, y+3, LARG-16, h-6, 3);
  gg.strokeStyle = '#93b4cc'; gg.lineWidth = 0.9; gg.stroke();
  if (nome){
    var w = FONT.misura(nome) + 12;
    UI.box(gg, 12, y-10, w, 14, '#dceaf2');
    FONT.scrivi(gg, nome, 18, y-6, UIC.testo);
  }
  var visti = 0;
  for (var i=0;i<righe.length;i++){
    var r = righe[i];
    var quanti = Math.max(0, Math.min(r.length, (caratteri === undefined ? 1e9 : caratteri) - visti));
    if (quanti > 0) FONT.scrivi(gg, r.slice(0, quanti), 17, y + 11 + i*11, UIC.testo);
    visti += r.length;
  }
  UI.avanti(gg, LARG-24, y + h - 13, Gioco.tempo);
}

/* ══════════════════════════════════════════════════════════════════
   15. SCENA: BATTAGLIA DI CONOSCENZA
   ══════════════════════════════════════════════════════════════════
   Regola: una risposta sbagliata non chiude la domanda, la rimanda in
   fondo alla coda. Prima però mostra la spiegazione. Si esce solo
   quando si sono capite tutte — o quando si finiscono le vite. */

var VITE_MAX = 3;
var TRANS_MAX = 20;

var scenaBattaglia = {
  entra: function(arg){
    this.a = arg;
    this.trans = TRANS_MAX;
    this.coda = (arg.domande || []).slice();
    this.totale = this.coda.length;
    this.vinte = 0;
    this.vite = VITE_MAX;                 // le vite si azzerano a ogni sfida
    this.sel = 0;
    this.fase = 'intro';
    this.introI = 0;
    this.scossa = 0;
    this.lampo = 0;
    this.esito = null;
    this.nuoveCarte = [];
    this.introRighe = (arg.intro && arg.intro.length) ? arg.intro.slice() : ['Cominciamo.'];
    this.dlg = { pagine: FONT.pagine(this.introRighe[0], LARG-44, 3), pag:0, car:0 };
  },

  domanda: function(){ return this.coda[0]; },

  agg: function(){
    if (this.trans > 0){ this.trans--; return; }
    if (this.scossa > 0) this.scossa--;
    if (this.lampo > 0) this.lampo--;
    if (this.fase === 'intro' || this.fase === 'fine'){
      var tot = (this.dlg.pagine[this.dlg.pag]||[]).join('\n').length;
      if (this.dlg.car < tot) this.dlg.car += 2;
    }
  },

  avanzaDialogo: function(dopo){
    var pag = this.dlg.pagine[this.dlg.pag] || [];
    var tot = pag.join('\n').length;
    if (this.dlg.car < tot){ this.dlg.car = tot; return false; }
    if (this.dlg.pag < this.dlg.pagine.length - 1){ this.dlg.pag++; this.dlg.car = 0; return false; }
    return dopo();
  },

  input: function(){
    var self = this;
    if (this.trans > 0){ Input.pulisci(); return; }
    var tap = Input.tap();

    if (this.fase === 'intro'){
      if (Input.premuto('a') || tap === 'avanti'){
        this.avanzaDialogo(function(){
          self.introI++;
          if (self.introI < self.introRighe.length){
            self.dlg = { pagine: FONT.pagine(self.introRighe[self.introI], LARG-44, 3), pag:0, car:0 };
          } else {
            self.fase = 'domanda'; self.sel = 0;
            var d = self.domanda();
            if (d) Gioco.save.viste[d.id] = true;
          }
          return true;
        });
      }
      return;
    }

    if (this.fase === 'domanda'){
      if (Input.premuto('su'))  this.sel = (this.sel + 3) % 4;
      if (Input.premuto('giu')) this.sel = (this.sel + 1) % 4;
      if (Input.premuto('sx'))  this.sel = (this.sel + 3) % 4;
      if (Input.premuto('dx'))  this.sel = (this.sel + 1) % 4;
      for (var k=1;k<=4;k++) if (Input.premuto('op'+k)){ this.rispondi(k-1); return; }
      if (typeof tap === 'number'){ this.sel = tap; this.rispondi(tap); return; }
      if (Input.premuto('a')) this.rispondi(this.sel);
      return;
    }

    if (this.fase === 'fine'){
      if (Input.premuto('a') || tap === 'avanti'){
        this.avanzaDialogo(function(){ self.chiudi(); return true; });
      }
      return;
    }
  },

  rispondi: function(i){
    var d = this.domanda();
    if (!d) return;
    var giusta = (i === (d.risposta - 1));
    Gioco.save.viste[d.id] = true;
    if (giusta){
      this.coda.shift();
      this.vinte++;
      this.lampo = 18;
      if (d.carta && !Gioco.save.carte[d.carta.id]){
        Gioco.save.carte[d.carta.id] = true;
        this.nuoveCarte.push(d.carta);
      }
    } else {
      this.vite--;
      this.scossa = 16;
      Gioco.save.sbagliate[d.id] = (Gioco.save.sbagliate[d.id] || 0) + 1;
      this.coda.push(this.coda.shift());   // la domanda torna, più avanti
    }
    Save.salva(Gioco.save);
    var self = this;
    Scene.push(scenaSpiegazione, {
      domanda:d, scelta:i, giusta:giusta,
      carta: giusta ? d.carta : null,
      dopo: function(){ self.dopoSpiegazione(); }
    });
  },

  dopoSpiegazione: function(){
    if (this.vite <= 0){ this.finisci(false); return; }
    if (!this.coda.length){ this.finisci(true); return; }
    this.fase = 'domanda'; this.sel = 0;
  },

  finisci: function(vinto){
    var a = this.a, u = Gioco.unita;
    this.vinto = vinto;
    if (vinto){
      if (a.tipo === 'missione'){
        Gioco.save.missioni[a.idMissione] = true;
        if (a.cartaBonus && !Gioco.save.carte[a.cartaBonus.id]){
          Gioco.save.carte[a.cartaBonus.id] = true;
          this.nuoveCarte.push(a.cartaBonus);
        }
      } else if (a.tipo === 'boss'){
        Gioco.save.medaglie[u.id] = true;
      }
      Save.salva(Gioco.save);
    }
    var righe = (vinto ? (a.vittoria||['Bravo.']) : (a.sconfitta||['Ripassa e torna.'])).slice();
    if (vinto && this.nuoveCarte.length){
      righe.push('Hai aggiunto ' + this.nuoveCarte.length +
        (this.nuoveCarte.length === 1 ? ' carta all\'album.' : ' carte all\'album.'));
    }
    this.fase = 'fine';
    this.dlg = { pagine: FONT.pagine(righe[0], LARG-44, 3), pag:0, car:0 };
    this.righeFine = righe; this.fineI = 0;
    this.introRighe = righe; this.introI = 0;
    // riuso lo stesso avanzamento del dialogo
    var self = this;
    this.chiudi = function(){
      self.fineI++;
      if (self.fineI < righe.length){
        self.dlg = { pagine: FONT.pagine(righe[self.fineI], LARG-44, 3), pag:0, car:0 };
        return;
      }
      Scene.pop({ vinto: vinto });
    };
  },

  chiudi: function(){ Scene.pop(); },

  sfondo: function(gg){
    // Cielo smorzato, una fila di colline lontane, terreno olivastro.
    // Niente colori pieni: la quarta generazione è tutta mezzi toni.
    var g1 = gg.createLinearGradient(0,0,0,60);
    g1.addColorStop(0,'#9ccbe2'); g1.addColorStop(1,'#dcecef');
    gg.fillStyle = g1; gg.fillRect(0,0,LARG,54);

    // Filare di chiome lontane: una fila di gobbe morbide, senza vuoti.
    gg.save();
    gg.fillStyle = '#9dbb92';
    gg.beginPath();
    gg.moveTo(-10, 56);
    for (var i=-10;i<=LARG+20;i+=22){
      var alt = 34 + ((i*13) % 7) * 2.2;
      gg.quadraticCurveTo(i+11, alt, i+22, 50);
    }
    gg.lineTo(LARG+20, 56); gg.closePath(); gg.fill();
    gg.fillStyle = '#88a97e';
    gg.beginPath();
    gg.moveTo(-10, 56);
    for (var i2=-2;i2<=LARG+20;i2+=26){
      var a2 = 42 + ((i2*7) % 5) * 1.8;
      gg.quadraticCurveTo(i2+13, a2, i2+26, 52);
    }
    gg.lineTo(LARG+20, 56); gg.closePath(); gg.fill();
    gg.restore();

    var g2 = gg.createLinearGradient(0,50,0,ALT);
    g2.addColorStop(0,'#93ae74'); g2.addColorStop(0.45,'#7f9e63'); g2.addColorStop(1,'#6b8a52');
    gg.fillStyle = g2; gg.fillRect(0,50,LARG,ALT-50);
    gg.fillStyle = 'rgba(255,255,255,.10)';
    gg.fillRect(0,50,LARG,1); gg.fillRect(0,53,LARG,1);
    gg.fillStyle = 'rgba(80,100,70,.10)';
    for (var m=0;m<44;m++){
      var mx = (m*53) % LARG, my = 58 + ((m*29) % 60);
      gg.fillRect(mx, my, 3, 2);
    }
  },

  dis: function(gg){
    var d = this.domanda(), a = this.a;
    var sc = this.scossa > 0 ? ((this.scossa % 4 < 2) ? 2 : -2) : 0;

    this.sfondo(gg);
    if (this.lampo > 0){
      gg.fillStyle = 'rgba(255,255,255,' + (this.lampo/44) + ')';
      gg.fillRect(0,0,LARG,ALT);
    }

    var righe = d ? FONT.spezza(d.testo, LARG - 36) : [];

    // Pedane e sfidanti. L'esaminatore sta più lontano e in alto,
    // il giocatore di spalle più vicino, più grande e più in basso.
    var sp = attore(a.veste || 'npc1').giu[0];
    var sx = LARG - 74 + sc, sy = 30;
    piattaforma(gg, sx + 13, sy + 40, 26, 7, '#9db881', '#7a9663');
    gg.drawImage(sp, sx, sy, 28, 42);

    piattaforma(gg, 46, 92, 36, 10, '#93ae74', '#6b8a52');
    gg.drawImage(spriteDietro(), 28, 36, 36, 54);

    // Riquadro dell'esaminatore: nome, unità e quante domande restano.
    var restanti = this.coda.length;
    UI.box(gg, 6, 4, 146, 28);
    var nome = a.nome || 'Esaminatore';
    while (FONT.misura(nome) > 104 && nome.length > 4) nome = nome.slice(0, -2) + '…';
    FONT.scrivi(gg, nome, 13, 8, UIC.testo);
    FONT.scrivi(gg, 'U' + Gioco.unita.numero, 138, 8, UIC.testoTenue);
    FONT.scrivi(gg, '?', 13, 19, UIC.etichetta);
    UI.barra(gg, 22, 20, 106, 4, this.totale ? (restanti/this.totale) : 0, UIC.hpRosso, UIC.hpFondo);
    var conta = restanti + '/' + this.totale;
    FONT.scrivi(gg, conta, 145 - FONT.misura(conta), 18, UIC.testoTenue);

    // Riquadro del giocatore: punti salute e, sotto, la barra della
    // collezione — che qui fa il mestiere della barra dell'esperienza.
    UI.box(gg, LARG-158, 4, 152, 34);
    FONT.scrivi(gg, 'TU', LARG-150, 8, UIC.testo);
    var pc = Math.round(Gioco.percentuale()*100) + '%';
    FONT.scrivi(gg, pc, LARG-14-FONT.misura(pc), 8, UIC.testoTenue);
    FONT.scrivi(gg, 'PS', LARG-150, 19, UIC.etichetta);
    UI.barraPS(gg, LARG-134, 20, 90, this.vite / VITE_MAX);
    var ps = this.vite + '/' + VITE_MAX;
    FONT.scrivi(gg, ps, LARG-14-FONT.misura(ps), 18, UIC.testo);
    UI.barra(gg, LARG-150, 29, 136, 3, Gioco.percentuale(), '#5aa8e0', '#5a6068');

    if (this.fase === 'intro' || this.fase === 'fine'){
      disegnaFumetto(gg, a.nome, this.dlg.pagine[this.dlg.pag] || [], this.dlg.car);
      Input.azzeraAree();
      Input.area('avanti', 0, 0, LARG, ALT);
      this.velo(gg);
      return;
    }

    if (!d){ this.velo(gg); return; }

    // Riquadro della domanda, sopra le risposte.
    var hq = righe.length*10 + 12;
    var yq = 110 - hq;
    UI.box(gg, 5, yq, LARG-10, hq);
    for (var r=0;r<righe.length;r++)
      FONT.scrivi(gg, righe[r], 15, yq + 6 + r*10, UIC.testo);

    // Le quattro risposte, come le voci di un menu della console:
    // quella scelta si illumina e ha il cursore a lato.
    Input.azzeraAree();
    var y0 = 114, hOp = 22, gap = 2;
    for (var o=0;o<4;o++){
      var y = y0 + o*(hOp+gap);
      var scelto = (o === this.sel);
      UI.box(gg, 5, y, LARG-10, hOp, scelto ? '#fdf2cf' : null, scelto ? '#c8a020' : UIC.bordo);
      FONT.scrivi(gg, String(o+1), 13, y + 7, scelto ? '#a8801a' : UIC.testoTenue);
      var ro = FONT.spezza(d.opzioni[o] || '', LARG - 46);
      if (ro.length === 1){
        FONT.scrivi(gg, ro[0], 23, y + 7, UIC.testo);
      } else {
        FONT.scrivi(gg, ro[0], 23, y + 2, UIC.testo);
        FONT.scrivi(gg, ro[1] || '', 23, y + 12, UIC.testo);
      }
      if (scelto) UI.cursore(gg, 0, y + 7, Gioco.tempo);
      Input.area(o, 5, y, LARG-10, hOp);
    }

    this.velo(gg);
  },

  // Entrata in battaglia: due tende che si aprono. Serve a segnare lo
  // stacco fra "sto camminando" e "mi stanno interrogando".
  velo: function(gg){
    if (this.trans <= 0) return;
    var q = this.trans / TRANS_MAX;
    var h = Math.ceil(ALT/2 * q);
    gg.fillStyle = C.ink;
    gg.fillRect(0, 0, LARG, h);
    gg.fillRect(0, ALT-h, LARG, h);
    gg.fillStyle = C.tealC;
    gg.fillRect(0, h-2, LARG, 2);
    gg.fillRect(0, ALT-h, LARG, 2);
  }
};

/* ══════════════════════════════════════════════════════════════════
   16. SCENA: SPIEGAZIONE (il momento in cui si impara)
   ══════════════════════════════════════════════════════════════════ */

var scenaSpiegazione = {
  entra: function(arg){
    this.a = arg;
    var d = arg.domanda, blocchi = [];
    if (arg.giusta){
      blocchi.push({ tono:'ok', titolo:'Esatto', testo:d.spiegazione });
    } else {
      var perche = (d.perche_no && d.perche_no[arg.scelta]) || '';
      blocchi.push({ tono:'no', titolo:'Non è questa',
        testo: (perche ? perche + ' ' : '') +
               'La risposta giusta è: «' + d.opzioni[d.risposta-1] + '».' });
      blocchi.push({ tono:'info', titolo:'Perché', testo:d.spiegazione });
    }
    this.blocchi = blocchi;
    this.b = 0; this.pag = 0;
    this.impagina();
  },
  impagina: function(){
    this.pagine = FONT.pagine(this.blocchi[this.b].testo, LARG - 40, 11);
    this.pag = 0;
  },
  agg: function(){},
  input: function(){
    if (!(Input.premuto('a') || Input.premuto('b') || Input.tap() === 'avanti')) return;
    if (this.pag < this.pagine.length - 1){ this.pag++; return; }
    if (this.b < this.blocchi.length - 1){ this.b++; this.impagina(); return; }
    var a = this.a;
    if (a.carta){
      var dopo = a.dopo;
      Scene.sostituisci(scenaCarta, { carta:a.carta, dopo:dopo });
      return;
    }
    Scene.pop();
    if (a.dopo) a.dopo();
  },
  dis: function(gg){
    var b = this.blocchi[this.b];
    var tinta = b.tono === 'ok' ? '#4e8a52' : (b.tono === 'no' ? '#b05548' : '#5a7fa8');
    var gr = gg.createLinearGradient(0,0,0,ALT);
    gr.addColorStop(0, b.tono === 'ok' ? '#e2efdf' : (b.tono === 'no' ? '#f2e2de' : '#e2eaf2'));
    gr.addColorStop(1, '#cdd6cf');
    gg.fillStyle = gr; gg.fillRect(0,0,LARG,ALT);

    var simbolo = b.tono === 'ok' ? '✓' : (b.tono === 'no' ? '✗' : '★');
    UI.box(gg, 5, 5, LARG-10, 18, tinta, UIC.bordo);
    // Niente maiuscolo forzato: in italiano l'accento su una maiuscola
    // in una griglia 5x7 si legge male, e qui i titoli hanno «è» e «é».
    FONT.scrivi(gg, simbolo + ' ' + b.titolo, 13, 10, '#ffffff');

    UI.box(gg, 5, 27, LARG-10, ALT-48);
    var righe = this.pagine[this.pag] || [];
    for (var i=0;i<righe.length;i++)
      FONT.scrivi(gg, righe[i], 15, 35 + i*11, UIC.testo);

    var nav = (this.pagine.length > 1)
      ? ('pagina ' + (this.pag+1) + ' di ' + this.pagine.length + ' · premi A')
      : 'premi A per continuare';
    FONT.scrivi(gg, nav, 8, ALT-13, '#6b7268');
    UI.avanti(gg, LARG-18, ALT-14, Gioco.tempo);

    Input.azzeraAree();
    Input.area('avanti', 0, 0, LARG, ALT);
  }
};

/* ══════════════════════════════════════════════════════════════════
   17. SCENA: CARTA CONOSCENZA SBLOCCATA
   ══════════════════════════════════════════════════════════════════ */

var ICONE = null;

var scenaCarta = {
  entra: function(arg){ this.a = arg; this.t = 0; },
  agg: function(){ this.t++; },
  input: function(){
    if (Input.premuto('a') || Input.premuto('b') || Input.tap() === 'avanti'){
      var dopo = this.a.dopo;
      Scene.pop();
      if (dopo) dopo();
    }
  },
  dis: function(gg){
    gg.fillStyle = '#101828'; gg.fillRect(0,0,LARG,ALT);
    // raggi
    for (var i=0;i<16;i++){
      var ang = i*0.3927 + this.t/120;
      gg.save();
      gg.translate(LARG/2, 96);
      gg.rotate(ang);
      gg.fillStyle = 'rgba(228,135,58,.09)';
      gg.fillRect(0,-7,190,14);
      gg.restore();
    }
    var titolo = 'NUOVA CARTA CONOSCENZA';
    FONT.scrivi(gg, titolo, (LARG - FONT.misura(titolo))/2, 10, C.ambra);

    var salto = Math.max(0, 6 - this.t/3);
    disegnaCarta(gg, this.a.carta, (LARG-CARTA_L)/2, 30 - salto);

    var msg = 'premi A';
    FONT.scrivi(gg, msg, (LARG - FONT.misura(msg))/2, ALT-14, '#5b6b85');
    Input.azzeraAree();
    Input.area('avanti', 0, 0, LARG, ALT);
  }
};

var CARTA_L = 224, CARTA_A = 150;

function disegnaCarta(gg, carta, x, y){
  var w = CARTA_L, h = CARTA_A;
  gg.fillStyle = 'rgba(15,20,32,.5)'; gg.fillRect(x+3, y+3, w, h);
  UI.box(gg, x, y, w, h, C.carta, C.ink);

  gg.fillStyle = C.teal; gg.fillRect(x+4, y+4, w-8, 14);
  FONT.scrivi(gg, (carta.categoria || '').toUpperCase(), x+9, y+7, C.carta);

  if (!ICONE) ICONE = costruisciIcone();
  var ico = ICONE[carta.icona] || ICONE.cellula;
  gg.fillStyle = '#e9e4d6'; gg.fillRect(x+4, y+18, w-8, 36);
  gg.drawImage(ico, x + 14, y + 20, 32, 32);

  var righeT = FONT.spezza(carta.titolo, w - 62);
  FONT.scrivi(gg, righeT[0], x+54, y + (righeT.length > 1 ? 26 : 31), C.cremisi);
  if (righeT.length > 1) FONT.scrivi(gg, righeT[1], x+54, y+37, C.cremisi);

  gg.fillStyle = '#d8d2c2'; gg.fillRect(x+8, y+58, w-16, 1);

  var righe = FONT.spezza(carta.testo || '', w-18);
  var max = 9;
  for (var i=0;i<righe.length && i<max;i++)
    FONT.scrivi(gg, righe[i], x+9, y+64 + i*9, C.ink);
  if (righe.length > max) FONT.scrivi(gg, '…', x+9, y+64 + max*9, '#5b6b85');
}

/* ══════════════════════════════════════════════════════════════════
   18. SCENA: ALBUM DELLE CARTE
   ══════════════════════════════════════════════════════════════════ */

var scenaAlbum = {
  entra: function(){
    this.tutte = [];
    var self = this;
    Gioco.giocabili().forEach(function(u){
      Gioco.carteUnita(u).forEach(function(c){ self.tutte.push(c); });
    });
    this.sel = 0; this.dettaglio = null;
    this.perPagina = 12;
  },
  input: function(){
    var tap = Input.tap();
    if (this.dettaglio){
      if (Input.premuto('a') || Input.premuto('b') || tap !== null) this.dettaglio = null;
      return;
    }
    if (Input.premuto('b') || Input.premuto('album') || tap === 'chiudi'){ Scene.pop(); return; }
    if (Input.premuto('sx')) this.sel = Math.max(0, this.sel-1);
    if (Input.premuto('dx')) this.sel = Math.min(this.tutte.length-1, this.sel+1);
    if (Input.premuto('su')) this.sel = Math.max(0, this.sel-3);
    if (Input.premuto('giu')) this.sel = Math.min(this.tutte.length-1, this.sel+3);
    if (typeof tap === 'number'){ this.sel = tap; this.apri(); return; }
    if (Input.premuto('a')) this.apri();
  },
  apri: function(){
    var c = this.tutte[this.sel];
    if (c && Gioco.save.carte[c.id]) this.dettaglio = c;
  },
  agg: function(){},
  dis: function(gg){
    gg.fillStyle = '#141d2c'; gg.fillRect(0,0,LARG,ALT);
    FONT.scrivi(gg, 'ALBUM DELLE CARTE', 10, 8, C.ambra);
    var conta = Gioco.carteAvute() + ' / ' + Gioco.carteTotali();
    FONT.scrivi(gg, conta, LARG - FONT.misura(conta) - 10, 8, C.tealC);
    gg.fillStyle = C.ombra; gg.fillRect(10, 19, LARG-20, 1);

    Input.azzeraAree();
    var pagina = Math.floor(this.sel / this.perPagina);
    var inizio = pagina * this.perPagina;
    var COL = 3, cw = 96, ch = 34, x0 = 10, y0 = 26;

    if (!ICONE) ICONE = costruisciIcone();

    for (var i=0;i<this.perPagina;i++){
      var idx = inizio + i;
      if (idx >= this.tutte.length) break;
      var c = this.tutte[idx];
      var avuta = !!Gioco.save.carte[c.id];
      var col = i % COL, rig = Math.floor(i / COL);
      var x = x0 + col*(cw+6), y = y0 + rig*(ch+5);
      var scelto = (idx === this.sel);
      UI.box(gg, x, y, cw, ch, avuta ? C.carta : '#232c3d', scelto ? C.ambra : C.ink);
      var ico = ICONE[c.icona] || ICONE.cellula;
      if (avuta){
        gg.drawImage(ico, x+4, y+ch/2-8, 16, 16);
        var rt = FONT.spezza(c.titolo, cw-28);
        FONT.scrivi(gg, rt[0], x+23, y + (rt.length>1 ? 8 : 13), C.ink);
        if (rt.length>1) FONT.scrivi(gg, rt[1], x+23, y+18, C.ink);
      } else {
        UI.lucchetto(gg, x+cw/2-4, y+8, '#3a4761');
        FONT.scrivi(gg, '???', x+cw/2-7, y+21, '#3a4761');
      }
      Input.area(idx, x, y, cw, ch);
    }

    var np = Math.ceil(this.tutte.length / this.perPagina);
    if (np > 1){
      var s = 'pagina ' + (pagina+1) + '/' + np + '  ·  frecce per sfogliare';
      FONT.scrivi(gg, s, (LARG - FONT.misura(s))/2, ALT-28, '#5b6b85');
    }
    FONT.scrivi(gg, 'A apre · B o I esce', 10, ALT-14, '#5b6b85');
    UI.box(gg, LARG-42, ALT-19, 34, 16, '#1e2636', C.ink);
    FONT.scrivi(gg, 'ESCI', LARG-38, ALT-14, C.cremisiC);
    Input.area('chiudi', LARG-42, ALT-19, 34, 16);

    if (this.dettaglio){
      gg.fillStyle = 'rgba(10,14,22,.85)'; gg.fillRect(0,0,LARG,ALT);
      disegnaCarta(gg, this.dettaglio, (LARG-CARTA_L)/2, 26);
      var m = 'premi A per chiudere';
      FONT.scrivi(gg, m, (LARG - FONT.misura(m))/2, ALT-14, '#5b6b85');
      Input.azzeraAree();
      Input.area('chiudi2', 0,0,LARG,ALT);
    }
  }
};

   19. SCENA: MAPPA DEL PROGRAMMA
   ══════════════════════════════════════════════════════════════════ */

var scenaMappa = {
  entra: function(){ this.sel = 0; this.msg = null; this.msgT = 0; },
  agg: function(){ if (this.msgT>0) this.msgT--; },
  input: function(){
    var tap = Input.tap();
    if (Input.premuto('b') || Input.premuto('mappa') || tap === 'chiudi'){ Scene.pop(); return; }
    if (Input.premuto('su')) this.sel = Math.max(0, this.sel-1);
    if (Input.premuto('giu')) this.sel = Math.min(Gioco.dati.unita.length-1, this.sel+1);
    if (typeof tap === 'number'){ this.sel = tap; this.scegli(); return; }
    if (Input.premuto('a')) this.scegli();
    if (Input.premuto('album')) { Scene.pop(); Scene.push(scenaAlbum); }
  },
  scegli: function(){
    var u = Gioco.dati.unita[this.sel];
    if (u.stato === 'giocabile'){
      if (u.id !== Gioco.unita.id){
        Gioco.unita = u;
        costruisciZona(u);
        Gioco.player.tx = Mondo.spawn.tx; Gioco.player.ty = Mondo.spawn.ty;
      }
      Scene.pop();
      return;
    }
    this.msg = 'Unità ' + u.numero + ' — in arrivo. Per ora si studia l\'Unità 7.';
    this.msgT = 150;
  },
  dis: function(gg){
    gg.fillStyle = '#141d2c'; gg.fillRect(0,0,LARG,ALT);
    FONT.scrivi(gg, 'IL PROGRAMMA DI BIOLOGIA', 10, 7, C.ambra);
    var pc = Math.round(Gioco.percentuale()*100) + '% coperto';
    FONT.scrivi(gg, pc, LARG - FONT.misura(pc) - 10, 7, C.tealC);
    UI.barra(gg, 10, 17, LARG-20, 4, Gioco.percentuale(), C.ambra, '#2b3550');

    Input.azzeraAree();
    var y0 = 26, h = 22;
    for (var i=0;i<Gioco.dati.unita.length;i++){
      var u = Gioco.dati.unita[i];
      var y = y0 + i*(h+2);
      var giocabile = u.stato === 'giocabile';
      var scelto = (i === this.sel);
      UI.box(gg, 8, y, LARG-16, h, giocabile ? C.carta : '#232c3d', scelto ? C.ambra : C.ink);

      var col = COLORI_ZONA[u.colore] || C.teal;
      gg.fillStyle = giocabile ? col : '#3a4761';
      gg.fillRect(11, y+3, 4, h-6);

      FONT.scrivi(gg, 'U' + u.numero, 19, y+3, giocabile ? UIC.testo : '#98a0ae');
      var nome = u.zona || u.titolo;
      FONT.scrivi(gg, nome, 40, y+3, giocabile ? UIC.testo : '#98a0ae');

      var rt = FONT.spezza(u.titolo, LARG-74);
      var sotto = rt[0] + (rt.length > 1 ? '…' : '');
      FONT.scrivi(gg, sotto, 19, y+12, giocabile ? UIC.testoTenue : '#6d7686');

      if (!giocabile){
        UI.lucchetto(gg, LARG-26, y+6, '#98a0ae');
      } else {
        UI.medaglia(gg, LARG-24, y+h/2, 7, !!Gioco.save.medaglie[u.id]);
      }
      if (scelto) UI.cursore(gg, 1, y+7, Gioco.tempo);
      Input.area(i, 8, y, LARG-16, h);
    }

    if (this.msgT>0 && this.msg){
      var righe = FONT.spezza(this.msg, LARG-40);
      UI.box(gg, 12, ALT-34, LARG-24, righe.length*10+12, C.carta);
      righe.forEach(function(r,i){ FONT.scrivi(gg, r, 22, ALT-28+i*10, C.ink); });
    } else {
      FONT.scrivi(gg, 'A entra · B esce', 10, ALT-12, '#5b6b85');
      UI.box(gg, LARG-42, ALT-17, 34, 15, '#1e2636', C.ink);
      FONT.scrivi(gg, 'ESCI', LARG-38, ALT-13, C.cremisiC);
      Input.area('chiudi', LARG-42, ALT-17, 34, 15);
    }
  }
};

/* ══════════════════════════════════════════════════════════════════
   21. CODICE DI RIPRESA (funziona anche dove non si può salvare)
   ══════════════════════════════════════════════════════════════════ */

function apriCodice(){
  var dlg = elem('modale');
  elem('modale-titolo').textContent = 'Codice di ripresa';
  elem('modale-corpo').innerHTML =
    '<p>Questo codice contiene il tuo progresso: carte, missioni e medaglie. ' +
    'Copialo e conservalo, oppure incollane uno qui e premi <b>Riprendi</b> ' +
    'per continuare su un altro dispositivo.</p>' +
    '<textarea id="campoCodice" spellcheck="false"></textarea>' +
    '<div class="riga"><button type="button" id="btnCopia">Copia</button>' +
    '<button type="button" id="btnRiprendi">Riprendi da questo codice</button></div>' +
    '<div id="esitoCodice"></div>';
  var campo = elem('campoCodice');
  campo.value = Save.esporta(Gioco.save);
  elem('btnCopia').onclick = function(){
    campo.select();
    try { document.execCommand('copy'); elem('esitoCodice').textContent = 'Copiato.'; }
    catch(e){ elem('esitoCodice').textContent = 'Selezionalo e copialo a mano.'; }
  };
  elem('btnRiprendi').onclick = function(){
    var d = Save.importa(campo.value);
    if (!d){ elem('esitoCodice').textContent = 'Questo codice non è valido.'; return; }
    Gioco.save = d;
    Save.salva(d);
    elem('esitoCodice').textContent = 'Fatto. Ricarico…';
    setTimeout(function(){ location.reload(); }, 700);
  };
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
}
elem('modale-ok').onclick = function(){
  var d = elem('modale');
  if (d.close) d.close(); else d.removeAttribute('open');
};

/* ══════════════════════════════════════════════════════════════════
   22. CICLO PRINCIPALE E PARTENZA
   ══════════════════════════════════════════════════════════════════ */

var fermo = false;

function fotogramma(){
  if (fermo) return;
  try {
    Gioco.tempo++;
    var s = Scene.cima();
    if (s){
      if (s.input) s.input();
      if (s.agg) s.agg();
      if (s.dis) s.dis(g);
    }
  } catch(e){
    // Al primo errore ci si ferma: chiedere un altro fotogramma
    // vorrebbe dire ripetere l'errore 60 volte al secondo.
    fermo = true;
    mostraErrore('BioQuest si è fermato',
      '<p>C\'è stato un problema mentre il gioco girava. Il progresso salvato non è stato toccato: ' +
      'ricaricando la pagina riprendi da dov\'eri.</p><pre>' +
      scappa((e && e.stack) || e) + '</pre>');
    return;
  }
  requestAnimationFrame(fotogramma);
}

function avvia(){
  var dati;
  try {
    dati = leggiContenuti();
  } catch(err){
    mostraErrore('Errore nei contenuti', err.amichevole || scappa(String(err)));
    return;
  }

  var errori = controlla(dati);
  if (errori.length){
    mostraErrore('I contenuti hanno ' + errori.length +
      (errori.length === 1 ? ' problema' : ' problemi'),
      '<p>Il gioco non parte finché non sono sistemati. Sono tutti dentro il blocco dei contenuti, ' +
      'in cima al file.</p><pre>' + errori.map(function(e,i){ return (i+1) + '. ' + e; }).join('\n\n') +
      '</pre>');
    return;
  }

  Gioco.dati = dati;
  Gioco.save = Save.carica();

  var giocabili = Gioco.giocabili();
  Gioco.unita = Gioco.unitaPer(Gioco.save.unita) || giocabili[0];
  if (!Gioco.unita || Gioco.unita.stato !== 'giocabile') Gioco.unita = giocabili[0];

  try {
    costruisciZona(Gioco.unita);
  } catch(e){
    mostraErrore('La piantina della zona non torna', '<pre>' + scappa(e.message) + '</pre>');
    return;
  }

  // Posizione salvata: valida solo se la zona è ancora la stessa.
  var p = Gioco.save.pos;
  if (p && p.unita === Gioco.unita.id && p.firma === Mondo.firma){
    Gioco.player.tx = p.tx; Gioco.player.ty = p.ty;
  } else {
    Gioco.player.tx = Mondo.spawn.tx; Gioco.player.ty = Mondo.spawn.ty;
  }
  Gioco.player.dir = 'su';

  ridimensiona();
  window.addEventListener('resize', ridimensiona);
  window.addEventListener('orientationchange', function(){ setTimeout(ridimensiona, 120); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', ridimensiona);

  Scene.push(scenaTitolo);
  requestAnimationFrame(fotogramma);
}

window.addEventListener('error', function(ev){
  if (fermo) return;
  fermo = true;
  mostraErrore('BioQuest non è riuscito a partire',
