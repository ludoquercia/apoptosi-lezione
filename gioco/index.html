<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="description" content="BioQuest — gioco educativo di biologia per il semestre aperto di Medicina. Unità 7: il controllo della proliferazione e della sopravvivenza cellulare.">
<title>BioQuest — Biologia, semestre aperto</title>

<style>
:root{
  --fondo:#0f1420;
  --fondo2:#1e2636;
  --bordo:#33415a;
  --ink:#0f1420;
  --carta:#f2efe6;
  --teal:#2e8480;
  --ambra:#e4873a;
  --cremisi:#c43e3b;
  --tasto:#1e2636;
  --tasto-attivo:#2e8480;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fondo);
  color:var(--carta);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
#stage{
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
#viewport{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
#schermo{
  display:block;
  background:#1b2430;
  border-radius:6px;
  box-shadow:0 0 0 2px #2c3646, 0 12px 44px rgba(0,0,0,.55);
  touch-action:none;
}
/* Layer invisibile per lettori di schermo e tastiera.
   pointer-events:none è OBBLIGATORIO: senza, questi bottoni rubano i tap
   destinati al canvas proprio nell'area delle risposte. */
#a11y{
  position:absolute;
  inset:0;
  pointer-events:none;
}
#a11y button{
  position:absolute;
  opacity:0;
  border:0;
  background:transparent;
  color:transparent;
  font:inherit;
}
#a11y button:focus-visible{
  opacity:1;
  outline:2px solid var(--ambra);
  color:transparent;
}

/* ── Comandi touch ─────────────────────────────────────── */
#touch{
  flex:0 0 auto;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 18px 16px;
  user-select:none;
}
#dpad{
  position:relative;
  width:min(150px,38vw);
  height:min(150px,38vw);
  flex:0 0 auto;
}
#dpad button{
  position:absolute;
  width:33.34%;
  height:33.34%;
  border:2px solid var(--bordo);
  background:var(--tasto);
  color:#8ba0c0;
  font-size:15px;
  line-height:1;
  border-radius:6px;
  display:grid;
  place-items:center;
  padding:0;
}
#dpad button:active,#dpad button[data-giu="1"]{background:var(--tasto-attivo);color:#fff}
#d-su{left:33.33%;top:0}
#d-giu{left:33.33%;bottom:0}
#d-sx{left:0;top:33.33%}
#d-dx{right:0;top:33.33%}
#azioni{
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:flex-end;
}
#azioni button{
  width:min(72px,18vw);
  height:min(72px,18vw);
  border-radius:50%;
  border:2px solid var(--bordo);
  background:var(--tasto);
  color:#c8d4e6;
  font-size:19px;
  font-weight:700;
  letter-spacing:.5px;
}
#azioni button:active{background:var(--tasto-attivo);color:#fff}
#b-a{border-color:#2e8480}
#b-b{border-color:#8f2c2a}

/* Su telefono e tablet i comandi ci sono; su desktop col mouse no. */
@media (hover:none) and (pointer:coarse){ #touch{display:flex} }
body.forza-touch #touch{display:flex}

/* In verticale lo schermo di gioco sta in alto e i comandi occupano
   lo spazio che avanza, invece di lasciare due bande nere. */
@media (orientation:portrait){
  #viewport{ align-items:center }
  #touch{ flex:1 1 auto; padding-bottom:24px }
  #dpad{ width:min(190px,48vw); height:min(190px,48vw) }
  #azioni button{ width:min(84px,21vw); height:min(84px,21vw); font-size:22px }
}

/* ── Schermata d'errore: DOM, non canvas ────────────────
   Se salta il boot il canvas potrebbe non esistere nemmeno.
   Questa invece si vede sempre, ed è selezionabile e copiabile. */
#errore{
  display:none;
  position:fixed;
  inset:0;
  z-index:99;
  background:#12161f;
  color:#f2efe6;
  padding:26px 22px;
  overflow:auto;
  font-size:14px;
  line-height:1.6;
}
#errore h1{
  font-size:17px;
  color:#e4873a;
  margin-bottom:14px;
  letter-spacing:.5px;
}
#errore pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#0b0e14;
  border-left:3px solid #c43e3b;
  padding:12px 14px;
  margin:12px 0;
  font-size:13px;
  user-select:text;
}
#errore p{max-width:60ch;margin-bottom:10px}

dialog{
  border:2px solid var(--bordo);
  background:#161d2b;
  color:var(--carta);
  padding:20px;
  max-width:min(520px,92vw);
  border-radius:4px;
  font-size:14px;
  line-height:1.6;
}
dialog::backdrop{background:rgba(6,9,15,.82)}
dialog h2{font-size:15px;color:var(--ambra);margin-bottom:12px}
dialog p{margin-bottom:12px;max-width:52ch}
dialog textarea{
  width:100%;
  height:110px;
  background:#0b0e14;
  color:#cfe3e1;
  border:1px solid var(--bordo);
  padding:9px;
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;
  resize:vertical;
  word-break:break-all;
}
dialog .riga{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
dialog button{
  background:var(--tasto);
  color:var(--carta);
  border:1px solid var(--bordo);
  padding:9px 15px;
  font:inherit;
  font-size:13px;
  border-radius:3px;
  cursor:pointer;
}
dialog button:hover{background:var(--teal);border-color:var(--teal)}
#esitoCodice{font-size:12px;color:#86c96e;margin-top:9px;min-height:1.2em}
</style>

<div id="stage">
  <div id="viewport">
    <canvas id="schermo" width="320" height="208" role="img" aria-label="BioQuest, gioco di biologia"></canvas>
    <div id="a11y" aria-live="polite">
      <button type="button" data-op="0" disabled></button>
      <button type="button" data-op="1" disabled></button>
      <button type="button" data-op="2" disabled></button>
      <button type="button" data-op="3" disabled></button>
    </div>
  </div>
  <div id="touch">
    <div id="dpad">
      <button type="button" id="d-su" data-t="su" aria-label="Su">▲</button>
      <button type="button" id="d-sx" data-t="sx" aria-label="Sinistra">◀</button>
      <button type="button" id="d-dx" data-t="dx" aria-label="Destra">▶</button>
      <button type="button" id="d-giu" data-t="giu" aria-label="Giù">▼</button>
    </div>
    <div id="azioni">
      <button type="button" id="b-a" data-t="a" aria-label="Conferma">A</button>
      <button type="button" id="b-b" data-t="b" aria-label="Indietro">B</button>
    </div>
  </div>
</div>

<div id="errore" role="alert">
  <h1>BioQuest non è riuscito a partire</h1>
  <div id="errore-corpo"></div>
</div>

<dialog id="modale">
  <h2 id="modale-titolo">Codice di ripresa</h2>
  <div id="modale-corpo"></div>
  <div class="riga">
    <button type="button" id="modale-ok">Chiudi</button>
  </div>
</dialog>

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

// Generatore pseudocasuale seedato: serve SOLO a generare le mappe,
// così la stessa zona viene identica a ogni avvio.
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// djb2: firma compatta di una stringa. Serve a capire se la mappa
// salvata è ancora la stessa di quella che stiamo per generare.
function hash32(s){
  var h = 5381;
  for (var i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0;
  return (h>>>0).toString(36);
}

/* ══════════════════════════════════════════════════════════════════
   3. TESTO — carattere di sistema, disegnato alla risoluzione vera
   ══════════════════════════════════════════════════════════════════
   Niente più caratteri costruiti pixel per pixel: a schermo pieno si
   vedevano i blocchetti. Qui si usa un carattere vero, disegnato dal
   browser alla risoluzione dello schermo, quindi nitido a ogni scala. */

var FONT = (function(){
  var PILA = '"Trebuchet MS", Verdana, "Segoe UI", system-ui, -apple-system, sans-serif';
  var DIM = 9.4, INTER = 12;
  var mis = document.createElement('canvas').getContext('2d');

  function stile(dim, peso){ return (peso || 600) + ' ' + (dim || DIM) + 'px ' + PILA; }
  mis.font = stile();

  function misura(t, dim, peso){
    if (dim || peso){
      mis.font = stile(dim, peso);
      var w = mis.measureText(String(t)).width;
      mis.font = stile();
      return w;
    }
    return mis.measureText(String(t)).width;
  }

  function scrivi(g, t, x, y, colore, dim, peso){
    g.font = stile(dim, peso);
    g.textBaseline = 'top';
    g.fillStyle = colore || '#3a3a42';
    g.fillText(String(t), x, y);
  }

  // Come scrivi, ma con un alone scuro dietro: serve quando il testo
  // finisce sopra il paesaggio invece che dentro un riquadro.
  function scriviRilievo(g, t, x, y, colore, dim){
    g.save();
    g.font = stile(dim);
    g.textBaseline = 'top';
    g.lineWidth = 2.4;
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(20,26,34,.75)';
    g.strokeText(String(t), x, y);
    g.fillStyle = colore || '#ffffff';
    g.fillText(String(t), x, y);
    g.restore();
  }

  // Manda a capo rispettando le parole; se una parola da sola non ci
  // sta (capita con gli indirizzi, non con l'italiano) la spezza.
  function spezza(testo, maxLarg, dim){
    var parole = String(testo).split(' '), righe = [], corrente = '';
    for (var i=0;i<parole.length;i++){
      var p = parole[i];
      var prova = corrente ? corrente + ' ' + p : p;
      if (misura(prova, dim) <= maxLarg){ corrente = prova; continue; }
      if (corrente){ righe.push(corrente); corrente = ''; }
      while (misura(p, dim) > maxLarg && p.length > 1){
        var taglio = p.length;
        while (taglio > 1 && misura(p.slice(0, taglio), dim) > maxLarg) taglio--;
        righe.push(p.slice(0, taglio));
        p = p.slice(taglio);
      }
      corrente = p;
    }
    if (corrente) righe.push(corrente);
    return righe.length ? righe : [''];
  }

  function pagine(testo, maxLarg, nRighe, dim){
    var r = spezza(testo, maxLarg, dim), out = [];
    for (var i=0;i<r.length;i+=nRighe) out.push(r.slice(i, i+nRighe));
    return out.length ? out : [['']];
  }

/* ══════════════════════════════════════════════════════════════════
   4. ARTE — personaggi e paesaggio disegnati a curve, non a quadretti

   Ogni cosa è disegnata con archi, sfumature e contorni morbidi, poi
   cotta una volta sola in una tela di appoggio a risoluzione quadrupla.
   Durante il gioco si ricopia soltanto: costa poco e resta smussata. */

var SS = 8;                       // quante volte più fine della misura logica
var SBAVA = 0.5;                  // le caselle si sovrappongono un filo:

                                  // una riga chiara e si vede la griglia
var PERS_L = 16, PERS_A = 24;     // ingombro di un personaggio, in unità di gioco

function tela(w,h){
  var c = document.createElement('canvas');
  c.width = Math.round(w*SS); c.height = Math.round(h*SS);
  var g = c.getContext('2d');
  g.scale(SS,SS);
  g.lineJoin = 'round'; g.lineCap = 'round';
  return { c:c, g:g };
}

function arrotondato(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

function ovale(g,cx,cy,rx,ry){
  g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,6.283185); g.closePath();
}

function bordo(g,colore,spessore){
  g.strokeStyle = colore; g.lineWidth = spessore || 0.7; g.stroke();
}

function sfuma(g,y0,y1,a,b){
  var gr = g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,a); gr.addColorStop(1,b);
  return gr;
}

/* ── I personaggi ──────────────────────────────────────────────── */

var VESTI = {
  eroe: { k:'#2c3242', h:'#6b4527', H:'#9a6a3c', s:'#f6cda6', S:'#dda87c',

function disegnaPersona(g, v, dir, frame){
  var dietro = (dir === 'su'), lato = (dir === 'dx');
  var d = (frame === 1) ? 1 : ((frame === 2) ? -1 : 0);

  // ombra a terra
  g.save(); g.globalAlpha = 0.22; g.fillStyle = '#16210f';
  ovale(g, 8, 23.0, 4.4, 1.25); g.fill(); g.restore();

  // gambe e scarpe
  var gx = lato ? 0.6 : 0;
  g.fillStyle = v.p;
  arrotondato(g, 5.5 + d*0.6 + gx, 17.8, 2.4, 4.4, 1.0); g.fill(); bordo(g, v.k);
  arrotondato(g, 8.1 - d*0.6 - gx, 17.8, 2.4, 4.4, 1.0); g.fill(); bordo(g, v.k);
  g.fillStyle = v.z;
  arrotondato(g, 5.2 + d*0.6 + gx, 20.9, 2.9, 1.9, 0.85); g.fill(); bordo(g, v.k);
  arrotondato(g, 7.9 - d*0.6 - gx, 20.9, 2.9, 1.9, 0.85); g.fill(); bordo(g, v.k);

  // busto
  g.fillStyle = sfuma(g, 12.2, 19.4, v.C, v.c);
  arrotondato(g, 3.7, 12.2, 8.6, 7.0, 2.5); g.fill(); bordo(g, v.k);
  if (!dietro && !lato){                       // colletto
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.moveTo(6.6,12.4); g.lineTo(8,14.1); g.lineTo(9.4,12.4);
    g.closePath(); g.fill();
  }

  // braccia
  g.fillStyle = v.c;
  arrotondato(g, 2.5, 13.2, 2.2, 4.6, 1.05); g.fill(); bordo(g, v.k);
  arrotondato(g, 11.3, 13.2, 2.2, 4.6, 1.05); g.fill(); bordo(g, v.k);
  g.fillStyle = v.s;
  ovale(g, 3.6, 18.1, 1.05, 1.0); g.fill(); bordo(g, v.k, 0.6);
  ovale(g, 12.4, 18.1, 1.05, 1.0); g.fill(); bordo(g, v.k, 0.6);

  // capelli dietro alla testa
  g.fillStyle = sfuma(g, 2, 13, v.H, v.h);
  ovale(g, 8, 8.0, 6.1, 6.3); g.fill(); bordo(g, v.k);

  if (!dietro){
    // viso
    g.fillStyle = sfuma(g, 3.5, 14, v.s, v.S);
    ovale(g, 8, 8.9, 5.2, 5.4); g.fill(); bordo(g, v.k, 0.6);

    // Frangia a ciocche: senza le punte i capelli sembrano un casco.
    g.fillStyle = sfuma(g, 2.4, 9, v.H, v.h);
    g.beginPath();
    g.moveTo(2.8, 8.4);
    g.bezierCurveTo(2.5, 2.4, 13.5, 2.4, 13.2, 8.4);
    g.lineTo(12.2, 6.0); g.lineTo(11.2, 7.6);
    g.lineTo(10.2, 5.2); g.lineTo(8.9, 7.0);
    g.lineTo(7.7, 4.9); g.lineTo(6.3, 7.2);
    g.lineTo(5.2, 5.4); g.lineTo(4.1, 7.4);
    g.closePath(); g.fill(); bordo(g, v.k, 0.6);
    // riflesso
    g.save(); g.globalAlpha = 0.45; g.fillStyle = '#ffffff';
    ovale(g, 5.6, 4.6, 2.0, 0.9); g.fill(); g.restore();

    // occhi
    var ox = lato ? 1.6 : 0;
    g.fillStyle = '#2b3040';
    ovale(g, 6.0 + ox, 9.7, 0.85, 1.15); g.fill();
    if (!lato){ ovale(g, 10.0, 9.7, 0.85, 1.15); g.fill(); }
    g.fillStyle = '#ffffff';
    ovale(g, 5.75 + ox, 9.3, 0.32, 0.42); g.fill();
    if (!lato){ ovale(g, 9.75, 9.3, 0.32, 0.42); g.fill(); }
    // guance
    g.save(); g.globalAlpha = 0.30; g.fillStyle = '#e08a86';
    ovale(g, 4.7 + ox*0.5, 11.0, 0.9, 0.55); g.fill();
    if (!lato){ ovale(g, 11.3, 11.0, 0.9, 0.55); g.fill(); }
    g.restore();
  } else {
    // Di spalle: capelli con la scriminatura e le punte sul collo,
    // altrimenti la nuca è una macchia e basta.
    g.save(); g.globalAlpha = 0.55; g.fillStyle = v.H;
    ovale(g, 6.3, 5.6, 2.6, 1.5); g.fill(); g.restore();
    g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 0.5;
    g.beginPath(); g.moveTo(8, 2.4); g.quadraticCurveTo(9.4, 7, 8.6, 12.6); g.stroke();
    g.fillStyle = v.h;
    g.beginPath();
    g.moveTo(3.2, 10.4);
    g.lineTo(4.4, 13.2); g.lineTo(5.6, 10.8); g.lineTo(7.0, 13.6);
    g.lineTo(8.4, 10.8); g.lineTo(9.8, 13.4); g.lineTo(11.2, 10.6);
    g.lineTo(12.8, 12.6); g.lineTo(12.8, 9.6); g.lineTo(3.2, 9.6);
    g.closePath(); g.fill(); bordo(g, v.k, 0.5);
  }

  // segni particolari
  if (v.extra === 'occhiali' && !dietro){
    g.strokeStyle = '#3a4152'; g.lineWidth = 0.55;
    ovale(g, 6.0, 9.6, 1.7, 1.5); g.stroke();
    ovale(g, 10.0, 9.6, 1.7, 1.5); g.stroke();
    g.beginPath(); g.moveTo(7.7,9.5); g.lineTo(8.3,9.5); g.stroke();
    g.save(); g.globalAlpha = 0.35; g.fillStyle = '#cfeaff';
    ovale(g, 6.0, 9.6, 1.6, 1.4); g.fill();
    ovale(g, 10.0, 9.6, 1.6, 1.4); g.fill(); g.restore();
  }
  if (v.extra === 'foglie'){
    // corona di foglie: Bìos è la biologia, e si vede
    var foglie = [[4.2,4.4,-0.9],[6.2,2.9,-0.4],[8.0,2.4,0],[9.8,2.9,0.4],[11.8,4.4,0.9]];
    for (var i=0;i<foglie.length;i++){
      g.save();
      g.translate(foglie[i][0], foglie[i][1]);
      g.rotate(foglie[i][2]);
      g.fillStyle = sfuma(g, -2, 1, '#7fe2a4', '#2f9a63');
      g.beginPath();
      g.moveTo(0, 1.4);
      g.bezierCurveTo(-1.5, 0.2, -1.2, -1.9, 0, -2.6);
      g.bezierCurveTo(1.2, -1.9, 1.5, 0.2, 0, 1.4);
      g.closePath(); g.fill(); bordo(g, '#1d5c3c', 0.45);
      g.restore();
    }
  }
}

var ATTORI = {};
function attore(nome){
  if (ATTORI[nome]) return ATTORI[nome];
  var v = VESTI[nome] || VESTI.eroe;
  var a = { giu:[], su:[], dx:[], sx:[] };
  for (var f=0; f<3; f++){
    ['giu','su','dx'].forEach(function(dir){
      var t = tela(PERS_L, PERS_A);
      disegnaPersona(t.g, v, dir, f);
      a[dir].push(t.c);
    });
    var m = tela(PERS_L, PERS_A);
    m.g.translate(PERS_L, 0); m.g.scale(-1, 1);
    m.g.drawImage(a.dx[f], 0, 0, PERS_L, PERS_A);
    a.sx.push(m.c);
  }
  ATTORI[nome] = a;
  return a;
}

function spriteDietro(){ return attore('eroe').su[0]; }

/* ── Il paesaggio ──────────────────────────────────────────────── */

var TEMI = {

  hpVerde:'#5cc95f', hpGiallo:'#e6c243', hpRosso:'#df5f52', hpFondo:'#4e5560',
  etichetta:'#c08a1e', blu:'#4f9ad8'
};

function costruisciCaselle(tema){
  var T = TEMI[tema] || TEMI.bosco;
  var out = {}, r = mulberry32(9137), t;

  function macchie(g, n, col, alfa, rmin, rmax){
    g.save(); g.globalAlpha = alfa; g.fillStyle = col;
    for (var i=0;i<n;i++){
      var rr = rmin + r()*(rmax-rmin);
      ovale(g, r()*16, r()*16, rr, rr*(0.55+r()*0.4)); g.fill();
    }
    g.restore();
  }
  function fili(g, n, col, alfa){
    g.save(); g.globalAlpha = alfa; g.strokeStyle = col; g.lineWidth = 0.55;
    for (var i=0;i<n;i++){
      var x = r()*16, y = 3 + r()*13;
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + 0.5, y - 1.4, x + 1.3, y - 2.4);
      g.stroke();
    }
    g.restore();
  }

  // Prato: sfumatura di fondo, macchie morbide, qualche filo d'erba.
  // Fondo PIENO, non sfumato: una sfumatura dentro il tassello, ripetuta
  // su tutta la mappa, diventa una fascia orizzontale che si vede subito.
  function prato(fili_n){
    var q = tela(16,16), g = q.g;
    g.fillStyle = T.erba; g.fillRect(0,0,16,16);
    macchie(g, 7, T.erbaS, 0.28, 1.6, 3.4);
    macchie(g, 5, T.erbaL, 0.24, 1.2, 2.6);
    fili(g, fili_n, T.erbaL, 0.55);
    return q.c;
  }
  out.erba1 = prato(3); out.erba2 = prato(2); out.erba3 = prato(4);
  out.erba = out.erba1;

  t = tela(16,16);
  t.g.drawImage(out.erba1, 0,0,16,16);
  [[4,5,'#f6f2e4'],[11,10,'#e79ab6'],[7,13,'#f2cf7a']].forEach(function(f){
    var g = t.g;
    g.fillStyle = f[2];
    for (var k=0;k<5;k++){
      var a = k*1.2566;
      ovale(g, f[0]+Math.cos(a)*1.05, f[1]+Math.sin(a)*1.05, 0.85, 0.85); g.fill();
    }
    g.fillStyle = '#f7d24a'; ovale(g, f[0], f[1], 0.65, 0.65); g.fill();
  });
  out.fiori = t.c;

  // Erba dello studio: più scura e più alta, si vede da lontano.
  t = tela(16,16);
  (function(g){
    g.fillStyle = '#537f45'; g.fillRect(0,0,16,16);
    macchie(g, 8, '#3d6334', 0.32, 1.6, 3.2);
    g.lineCap = 'round';
    for (var i=0;i<22;i++){
      var x = r()*16, h = 5 + r()*7, y = 16 - r()*3;
      g.strokeStyle = (i%3===0) ? T.chiomaL : (i%2 ? '#5b8f4d' : '#4a7a41');
      g.lineWidth = 0.85;
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + (r()-0.5)*2.2, y - h*0.6, x + (r()-0.5)*3.4, y - h);
      g.stroke();
    }
  })(t.g);
  out.erbaAlta = t.c;

  // Sentiero di terra battuta.
  t = tela(16,16);
  (function(g){
    g.fillStyle = T.terra; g.fillRect(0,0,16,16);
    macchie(g, 9, T.terraO, 0.20, 1.2, 2.8);
    macchie(g, 5, '#e0cfa8', 0.22, 1.4, 3.0);
    g.save(); g.globalAlpha = 0.5;
    for (var i=0;i<7;i++){
      var x = r()*16, y = r()*16, rr = 0.5 + r()*0.7;
      g.fillStyle = T.terraO; ovale(g,x,y,rr,rr*0.7); g.fill();
      g.fillStyle = '#f0e2c6'; ovale(g,x-0.15,y-0.25,rr*0.6,rr*0.4); g.fill();
    }
    g.restore();
  })(t.g);
  out.sentiero = t.c;

  // Bordi morbidi del sentiero verso il prato.
  out.bordo = {};
  [['su',0],['giu',1],['sx',2],['dx',3]].forEach(function(l){
    var q = tela(16,16), g = q.g;
    g.save();
    g.translate(8,8); g.rotate(l[1]*1.5708); g.translate(-8,-8);
    var gr = g.createLinearGradient(0,0,0,5);
    gr.addColorStop(0,'rgba(110,95,68,.55)'); gr.addColorStop(1,'rgba(110,95,68,0)');
    g.fillStyle = gr; g.fillRect(-1,-1,18,5.5);
    g.restore();
    out.bordo[l[0]] = q.c;
  });

  // Siepe di confine.
  t = tela(16,16);
  (function(g){
    g.fillStyle = '#427a45'; g.fillRect(0,0,16,16);
    macchie(g, 10, T.chiomaC, 0.38, 1.8, 3.4);
    macchie(g, 6, T.chiomaO, 0.35, 1.4, 2.8);
    g.fillStyle = 'rgba(255,255,255,.20)';
    arrotondato(g, 0.5, 0.5, 15, 4, 2); g.fill();
    g.fillStyle = 'rgba(20,40,22,.35)'; g.fillRect(0,13.5,16,2.5);
  })(t.g);
  out.siepe = t.c;

  // Roccia.
  t = tela(16,16);
  t.g.drawImage(out.erba1, 0,0,16,16);
  (function(g){
    g.fillStyle = sfuma(g,3,14,T.pietra,T.pietraO);
    g.beginPath();
    g.moveTo(2.5,13.5); g.lineTo(3.5,7); g.lineTo(6,4.5);
    g.lineTo(10.5,4.8); g.lineTo(13.5,8.5); g.lineTo(13,13.5);
    g.closePath(); g.fill(); bordo(g,'#5d6260',0.6);
    g.fillStyle = 'rgba(255,255,255,.30)';
    g.beginPath(); g.moveTo(4,7.2); g.lineTo(6.2,5); g.lineTo(8.6,5.6);
    g.lineTo(6,8.4); g.closePath(); g.fill();
    g.save(); g.globalAlpha=.25; g.fillStyle='#2f3630';
    ovale(g,8,14,5.6,1.2); g.fill(); g.restore();
  })(t.g);
  out.roccia = t.c;

  // Acqua: due fotogrammi con onde morbide.
  out.acqua = [];
  for (var f=0; f<2; f++){
    t = tela(16,16);
    (function(g, f){
      g.fillStyle = sfuma(g,0,16,T.acquaC,T.acqua); g.fillRect(0,0,16,16);
      g.save(); g.globalAlpha = 0.55;
      for (var i=0;i<4;i++){
        var y = 2 + i*4 + (f?1.6:0);
        g.strokeStyle = i%2 ? T.acquaS : '#ffffff';
        g.lineWidth = 0.9;
        g.beginPath();
        g.moveTo(-1, y);
        for (var x=-1; x<=17; x+=4) g.quadraticCurveTo(x+1, y-1.1, x+2, y);
        g.stroke();
      }
      g.restore();
      g.save(); g.globalAlpha = 0.75; g.fillStyle = '#ffffff';
      ovale(g, f?11:4, f?4:11, 1.5, 0.5); g.fill();
      g.restore();
    })(t.g, f);
    out.acqua.push(t.c);
  }

  // Piazzola della missione: lastra che arriva al bordo, così quattro
  // caselle accostate formano un unico pavimento e non quattro mattonelle.
  t = tela(16,16);
  (function(g){
    g.fillStyle = sfuma(g,0,16,'#d9dcd4','#b0b5ac'); g.fillRect(0,0,16,16);
    macchie(g, 6, '#c2c7be', 0.5, 1.6, 3.4);
    g.save(); g.globalAlpha = 0.35;
    g.strokeStyle = '#8d938a'; g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(0,8.2); g.lineTo(16,8.2); g.stroke();
    g.beginPath(); g.moveTo(8.2,0); g.lineTo(8.2,16); g.stroke();
    g.restore();
    g.fillStyle = 'rgba(255,255,255,.30)'; g.fillRect(0,0,16,1.6);
  })(t.g);
  out.piazzola = t.c;

  // Pavimento dell'arena.
  t = tela(16,16);
  (function(g){
    g.fillStyle = sfuma(g,0,16,'#5b5266','#3f3849'); g.fillRect(0,0,16,16);
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 0.6;
    g.strokeRect(0.6,0.6,14.8,14.8);
    macchie(g, 5, '#6f6480', 0.30, 1.2, 2.4);
  })(t.g);
  out.arena = t.c;

  // Cancello chiuso.
  t = tela(16,16);
  (function(g){
    g.fillStyle = 'rgba(40,44,56,.55)'; g.fillRect(0,0,16,16);
    for (var x=1.4;x<15;x+=4.2){
      g.fillStyle = sfuma(g,0,16,'#dfe4ea','#8d949e');
      arrotondato(g,x,0,2.1,16,1); g.fill(); bordo(g,'#565d68',0.5);
    }
    [4.6, 11].forEach(function(y){
      g.fillStyle = sfuma(g,y,y+2.4,'#dfe4ea','#8d949e');
      arrotondato(g,0,y,16,2.4,1); g.fill(); bordo(g,'#565d68',0.5);
    });
    g.fillStyle = sfuma(g,6,11,'#f0c24e','#b4802a');
    arrotondato(g,5.8,7.4,4.4,4,1.2); g.fill(); bordo(g,'#7d5a1c',0.6);
    g.strokeStyle = '#b4802a'; g.lineWidth = 0.9;
    g.beginPath(); g.arc(8,7.2,1.5,3.14,6.28); g.stroke();
    g.fillStyle = '#7d5a1c'; ovale(g,8,9.2,0.55,0.7); g.fill();
  })(t.g);
  out.cancello = t.c;

  return out;
}

// Oggetti alti: si disegnano insieme ai personaggi, in ordine di
// profondità, così ci si passa dietro.
function costruisciAlti(tema){
  var T = TEMI[tema] || TEMI.bosco;
  var out = {}, r = mulberry32(4242), t;

  // Albero: due caselle di lato, chioma a più strati, luce da sinistra.
  t = tela(32,32);
  (function(g){
    g.save(); g.globalAlpha = 0.25; g.fillStyle = '#26331f';
    ovale(g, 16, 29, 9, 2.4); g.fill(); g.restore();

    g.fillStyle = sfuma(g,20,31,T.tronco,T.troncoS);
    g.beginPath();
    g.moveTo(13.6,30); g.lineTo(14.4,19); g.lineTo(17.6,19); g.lineTo(18.4,30);
    g.closePath(); g.fill(); bordo(g,'#4a351f',0.7);
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(15.2,28.5); g.lineTo(15.6,20); g.stroke();

    var gruppi = [[16,14,12,10.5],[9,15,7,6],[23,15,7,6],[13,8,6.5,5.5],[20,9,6,5]];
    g.fillStyle = T.chiomaO;
    gruppi.forEach(function(c){ ovale(g,c[0],c[1]+0.8,c[2],c[3]); g.fill(); });
    g.fillStyle = T.chioma;
    gruppi.forEach(function(c){ ovale(g,c[0],c[1],c[2]*0.95,c[3]*0.95); g.fill(); });
    g.save(); g.globalAlpha = 0.85; g.fillStyle = T.chiomaC;
    [[13,12,8,6.4],[9.5,13.5,5,4],[19,11,5.5,4.4]].forEach(function(c){
      ovale(g,c[0],c[1],c[2],c[3]); g.fill();
    });
    g.restore();
    g.save(); g.globalAlpha = 0.7; g.fillStyle = T.chiomaL;
    [[11.5,9.5,4.4,3.2],[15,7.5,3,2.2]].forEach(function(c){
      ovale(g,c[0],c[1],c[2],c[3]); g.fill();
    });
    g.restore();
    // frastaglio del bordo
    g.fillStyle = T.chiomaO;
    g.save(); g.globalAlpha = 0.5;
    for (var i=0;i<26;i++){
      var a = r()*6.283, rr = 10 + r()*2.2;
      ovale(g, 16 + Math.cos(a)*rr, 14 + Math.sin(a)*rr*0.85, 1.5, 1.2); g.fill();
    }
    g.restore();
  })(t.g);
  out.albero = { img:t.c, dx:-8, dy:-16, w:32, h:32 };

  // Cartello di legno.
  t = tela(16,24);
  (function(g){
    g.save(); g.globalAlpha = 0.22; g.fillStyle = '#26331f';
    ovale(g, 8, 22.6, 3.6, 1.1); g.fill(); g.restore();
    g.fillStyle = sfuma(g,14,23,T.tronco,T.troncoS);
    arrotondato(g,7,13,2.2,10,0.7); g.fill(); bordo(g,'#4a351f',0.6);
    g.fillStyle = sfuma(g,3,15,'#e2c79a','#b9975f');
    arrotondato(g,1.2,3,13.6,11,1.6); g.fill(); bordo(g,'#7d5f36',0.8);
    g.strokeStyle = 'rgba(110,80,45,.75)'; g.lineWidth = 0.7;
    [6.2, 8.6, 11].forEach(function(y){
      g.beginPath(); g.moveTo(3.4,y); g.lineTo(y===11?10:12.6,y); g.stroke();
    });
  })(t.g);
  out.cartello = { img:t.c, dx:0, dy:-8, w:16, h:24 };

  return out;
}

/* ── Icone delle carte conoscenza ──────────────────────────────── */
function costruisciIcone(){
  var o = {}, t;

  t = tela(16,16);                       // cellula
  (function(g){
    g.fillStyle = sfuma(g,2,15,'#8fdcd6','#2f8a86');
    ovale(g,8,8.5,6.2,5.8); g.fill(); bordo(g,'#1d5f5c',0.7);
    g.fillStyle = 'rgba(255,255,255,.35)'; ovale(g,6,6,2.6,2); g.fill();
    g.fillStyle = '#1d5f5c'; ovale(g,9,9.4,2.2,2); g.fill();
  })(t.g);

  t = tela(16,16);                       // doppia elica
  (function(g){

    for (var s=0;s<2;s++){

      g.beginPath(); g.moveTo(a,y2); g.lineTo(b,y2); g.stroke();
    }
  })(t.g);
  o.dna = t.c;

  t = tela(16,16);                       // mitocondrio
  (function(g){
    g.fillStyle = sfuma(g,3,13,'#ef8f88','#b9433c');
    ovale(g,8,8,7,4.4); g.fill(); bordo(g,'#8d2f2a',0.7);
    g.strokeStyle = '#8d2f2a'; g.lineWidth = 0.9;
    for (var i=-2;i<=2;i++){
      g.beginPath();
      g.moveTo(8+i*2.4, 4.4);
      g.quadraticCurveTo(8+i*2.4+1.4, 8, 8+i*2.4, 11.6);
      g.stroke();
    }
  })(t.g);
  o.mito = t.c;

  t = tela(16,16);                       // forbici
  (function(g){
    g.strokeStyle = '#aeb6c2'; g.lineWidth = 1.6; g.lineCap='round';
    g.beginPath(); g.moveTo(3.5,2.5); g.lineTo(11,11); g.stroke();
    g.beginPath(); g.moveTo(12.5,2.5); g.lineTo(5,11); g.stroke();
    g.strokeStyle = '#7c8492'; g.lineWidth = 1.2;
    g.beginPath(); g.arc(5.6,12.8,2.1,0,6.283); g.stroke();
    g.beginPath(); g.arc(10.4,12.8,2.1,0,6.283); g.stroke();
    g.fillStyle = '#dfe4ea'; ovale(g,8,7.4,0.9,0.9); g.fill();
  })(t.g);
  o.forbici = t.c;

  t = tela(16,16);                       // scudo
  (function(g){
    g.fillStyle = sfuma(g,2,15,'#8fd08a','#3f8a46');
    g.beginPath();
    g.moveTo(8,1.6); g.lineTo(14,4); g.lineTo(14,8.6);
    g.bezierCurveTo(14,12, 11,14.2, 8,15.2);
    g.bezierCurveTo(5,14.2, 2,12, 2,8.6);
    g.lineTo(2,4); g.closePath(); g.fill(); bordo(g,'#2b6431',0.8);
    g.strokeStyle = '#ffffff'; g.lineWidth = 1.6; g.lineCap='round';
    g.beginPath(); g.moveTo(5.4,8.2); g.lineTo(7.3,10.4); g.lineTo(10.8,5.6); g.stroke();
  })(t.g);
  o.scudo = t.c;

  return o;

/* ══════════════════════════════════════════════════════════════════
   5. IL MONDO — la piantina della zona
   ══════════════════════════════════════════════════════════════════
   La mappa è una piantina leggibile a occhio: ogni carattere è una
   casella. Il giocatore entra dal basso (P) e sale.

     .  erba          ,  erba fiorita     E  erba dello studio
     -  sentiero      #  siepe            T  albero
     R  roccia        ~  acqua            C  cartello
     X  cancello (si apre superando la missione che sta sotto)
     1..4 piazzola di missione            b  piazzola del boss
     P  punto di ingresso del giocatore

   I cancelli si aprono dal basso verso l'alto: il più in basso è
   quello della Missione 1. Aggiungere una missione significa
   aggiungere una piazzola e un cancello a questa piantina. */

var PIANTINA = [
'##########################',
'#TT##################TT###',
'#T....BBBBBBBBBBBB....T..#',
'#.....BBBB-bb-BBBB.....R.#',
'#..T..BBBB-bb-BBBB..T....#',
'#.....BBBB----BBBB.......#',
'#..R..BBBB----BBBB....T..#',
'#.........----...........#',
'#.T.......----.......T...#',
'#....,....----....,......#',
'#...TT....----....TT.....#',
'#.........XXXX...........#',
'#....R....-44-....R......#',
'#.T.......-44-.......T...#',
'#~~~~.....----.....~~~~..#',
'#~~~~.EEE.----.EEE.~~~~..#',
'#~~~~.EEE.----.EEE.~~~~..#',
'#.........XXXX...........#',
'#...TT....-33-....TT.....#',
'#.........-33-...........#',
'#....R....----....R......#',
'#.T.......XXXX.......T...#',
'#.........-22-...........#',
'#...TT....-22-....TT.....#',
'#....,....----....,......#',
'#..EEE....XXXX....EEE....#',
'#..EEE....----....EEE....#',
'#.........-11-...........#',
'#...T.....-11-.....T.....#',
'#........G----...........#',
'#....C....-PP-....R......#',
'##########################'
];

// Quali caselle si attraversano e quali no.
var SOLIDI = { '#':1, 'T':1, 'R':1, '~':1, 'C':1, 'B':1, 'X':1 };

// Carattere della piantina -> casella del terreno.
var CASELLA_DI = {
  '.':'erba', ',':'fiori', 'E':'erbaAlta', '-':'sentiero', 'P':'sentiero',
  '#':'siepe', 'T':'erba', 'R':'roccia', '~':'acqua', 'C':'erba', 'G':'erba',
  'X':'cancello', 'B':'siepe', 'b':'arena',
  '1':'piazzola', '2':'piazzola', '3':'piazzola', '4':'piazzola'
};

// Caselle su cui poggia un oggetto alto, disegnato insieme ai personaggi.
var ALTO_DI = { 'T':'albero', 'C':'cartello' };

// Caselle che si considerano "sentiero" per il calcolo dei bordi.
var E_SENTIERO = { '-':1, 'P':1, '1':1, '2':1, '3':1, '4':1 };

var Mondo = {
  larg:0, alt:0, griglia:null, solido:null,
  base:null,                 // canvas con la zona già dipinta
  acquaCelle:[],             // caselle animate, ridipinte a ogni frame
  cancelli:[],               // { tx, ty, missione }
  npc:[], spawn:{tx:12,ty:29}, caselle:null, firma:''
};

function costruisciZona(unita){
  var righe = PIANTINA;
  var L = righe[0].length, A = righe.length;

  // Controllo di sanità: una piantina storta si vede subito, ma meglio dirlo.
  for (var i=0;i<A;i++){
    if (righe[i].length !== L)
      throw new Error('La piantina ha la riga ' + (i+1) + ' lunga ' +
        righe[i].length + ' invece di ' + L + '.');
  }

  Mondo.larg = L; Mondo.alt = A;
  Mondo.griglia = righe;
  Mondo.solido = new Uint8Array(L*A);
  Mondo.acquaCelle = [];
  Mondo.cancelli = [];
  Mondo.npc = [];
  Mondo.caselle = costruisciCaselle(unita.tema || 'bosco');
  Mondo.disegniAlti = costruisciAlti(unita.tema || 'bosco');
  Mondo.alti = [];

  var piazzole = {};      // numero missione -> {tx,ty} (la casella più in alto)
  var bossPad = null, spawnTrovato = false, guidaPos = null;

  for (var y=0;y<A;y++) for (var x=0;x<L;x++){
    var ch = righe[y].charAt(x);
    Mondo.solido[y*L+x] = SOLIDI[ch] ? 1 : 0;
    if (ch === '~') Mondo.acquaCelle.push([x,y]);
    if (ALTO_DI[ch]) Mondo.alti.push({ tx:x, ty:y, tipo:ALTO_DI[ch] });
    if (ch === 'P' && !spawnTrovato){ Mondo.spawn = { tx:x, ty:y }; spawnTrovato = true; }
    if (ch >= '1' && ch <= '9'){
      var n = +ch;
      if (!piazzole[n]) piazzole[n] = { tx:x, ty:y };
    }
    if (ch === 'b' && !bossPad) bossPad = { tx:x, ty:y };
    if (ch === 'G') guidaPos = { tx:x, ty:y };
    if (ch === 'X') Mondo.cancelli.push({ tx:x, ty:y, missione:-1 });
  }

  // I cancelli si assegnano alle missioni dal basso verso l'alto.
  var perRiga = {};
  Mondo.cancelli.forEach(function(c){ (perRiga[c.ty] = perRiga[c.ty] || []).push(c); });
  var righeCancello = Object.keys(perRiga).map(Number).sort(function(a,b){ return b-a; });
  righeCancello.forEach(function(ty, i){
    perRiga[ty].forEach(function(c){ c.missione = i; });
  });

  // Gli esaminatori stanno sulla loro piazzola.
  var missioni = unita.missioni || [];
  for (var m=0;m<missioni.length;m++){
    var p = piazzole[m+1];
    if (!p) throw new Error('Nella piantina manca la piazzola numero ' + (m+1) +
      ' per la missione "' + (missioni[m].titolo || '') + '". Aggiungi le caselle "' +
      (m+1) + '" alla piantina, oppure togli una missione.');
    Mondo.npc.push({
      tipo:'missione', indice:m, tx:p.tx, ty:p.ty, dir:'giu',
      veste:'npc' + (((missioni[m].npc && missioni[m].npc.aspetto) || (m+1)) % 4 + 1),
      nome:(missioni[m].npc && missioni[m].npc.nome) || 'Esaminatore'
    });
  }
  if (unita.boss && bossPad){
    Mondo.npc.push({
      tipo:'boss', indice:-1, tx:bossPad.tx, ty:bossPad.ty, dir:'giu',
      veste:'prof', nome:unita.boss.nome || 'Esaminatore'
    });
  }
  if (guidaPos){
    Mondo.npc.push({
      tipo:'guida', indice:-1, tx:guidaPos.tx, ty:guidaPos.ty, dir:'dx',
      veste:'bios', nome:'Bìos'
    });
  }

  Mondo.firma = hash32([unita.id, unita.tema, unita.seed, missioni.length, L, A].join('|'));

  // Per ogni casella di sentiero si segna in anticipo quali lati
  // confinano col prato: durante il gioco basta leggere un numero.
  Mondo.bordi = new Uint8Array(L*A);
  var lati = [[0,-1,1],[0,1,2],[-1,0,4],[1,0,8]];
  for (y=0;y<A;y++) for (x=0;x<L;x++){
    var ch2 = righe[y].charAt(x);
    if (!E_SENTIERO[ch2] && ch2 !== 'X') continue;
    var m = 0;
    for (var l=0;l<4;l++){
      var nx = x + lati[l][0], ny = y + lati[l][1];
      var vic = (nx<0||ny<0||nx>=L||ny>=A) ? '#' : righe[ny].charAt(nx);
      if (!E_SENTIERO[vic] && vic !== 'X') m |= lati[l][2];
    }
    Mondo.bordi[y*L+x] = m;
  }

  return Mondo;
}

// Restituisce la casella di terreno da disegnare in quel punto.
function casellaIn(x,y){
  var cas = Mondo.caselle;
  var ch = Mondo.griglia[y].charAt(x);
  if (ch === 'X' && !Mondo.solido[y*Mondo.larg+x]) ch = '-';
  var nome = CASELLA_DI[ch] || 'erba';
  if (nome === 'erba'){
    var v = (x*7 + y*13) % 7;
    return v === 0 ? cas.erba2 : (v === 3 ? cas.erba3 : cas.erba1);
  }
  if (nome === 'acqua') return cas.acqua[Math.floor(Gioco.tempo/26) % 2];
  return cas[nome];
}

function apriCancelli(fattiCount){
  var cambiato = false;
  for (var i=0;i<Mondo.cancelli.length;i++){
    var c = Mondo.cancelli[i];
    if (c.missione < fattiCount && Mondo.solido[c.ty*Mondo.larg + c.tx]){
      Mondo.solido[c.ty*Mondo.larg + c.tx] = 0;
      cambiato = true;
    }
  }
  return cambiato;
}

function solidoIn(tx,ty){
  if (tx<0 || ty<0 || tx>=Mondo.larg || ty>=Mondo.alt) return true;
  if (Mondo.solido[ty*Mondo.larg+tx]) return true;
  for (var i=0;i<Mondo.npc.length;i++){
    var n = Mondo.npc[i];
    if (n.tx===tx && n.ty===ty) return true;
  }
  return false;
}

function caselleIn(tx,ty){
  if (tx<0 || ty<0 || tx>=Mondo.larg || ty>=Mondo.alt) return '#';
  return Mondo.griglia[ty].charAt(tx);
}

// Se la casella di partenza è murata (per esempio perché la piantina
// è cambiata dopo un salvataggio) si cerca a spirale la più vicina libera.
function cellaLibera(tx,ty){
  if (!solidoIn(tx,ty)) return {tx:tx, ty:ty};
  for (var r=1;r<=12;r++){
    for (var dy=-r;dy<=r;dy++) for (var dx=-r;dx<=r;dx++){
      if (Math.abs(dx)!==r && Math.abs(dy)!==r) continue;
      if (!solidoIn(tx+dx,ty+dy)) return {tx:tx+dx, ty:ty+dy};
    }
  }
  return {tx:Mondo.spawn.tx, ty:Mondo.spawn.ty};
}

/* ══════════════════════════════════════════════════════════════════
   6. SALVATAGGIO
   ══════════════════════════════════════════════════════════════════
   Dentro un artifact o in un iframe lo spazio di memoria del browser
   può essere negato: in quel caso il solo accesso a localStorage
   lancia un errore. Qui si sonda una volta e, se non c'è, si tiene
   tutto in memoria per la sessione — il gioco funziona lo stesso,
   e il "codice di ripresa" permette comunque di portarsi il progresso. */

var CHIAVE = 'bioquest.v1';

var Save = (function(){
  var disponibile = false, memoria = {};
  try {
    var ls = window.localStorage;
    ls.setItem(CHIAVE + '.test', '1');
    ls.removeItem(CHIAVE + '.test');
    disponibile = true;
  } catch(e){ disponibile = false; }

  function leggiGrezzo(){
    if (!disponibile) return memoria[CHIAVE] || null;
    try { return window.localStorage.getItem(CHIAVE); } catch(e){ return null; }
  }
  function scriviGrezzo(s){
    if (!disponibile){ memoria[CHIAVE] = s; return; }
    try { window.localStorage.setItem(CHIAVE, s); } catch(e){ memoria[CHIAVE] = s; }
  }

  function vuoto(){
    return {
      v: 1,
      missioni: {},        // id missione -> true
      carte: {},           // id carta -> true
      medaglie: {},        // id unità -> true
      sbagliate: {},       // id domanda -> quante volte
      viste: {},           // id domanda -> true
      pos: null,           // { unita, tx, ty, firma }
      unita: 'u7'
    };
  }

  function sanifica(d){
    var s = vuoto();
    if (!d || typeof d !== 'object') return s;
    ['missioni','carte','medaglie','sbagliate','viste'].forEach(function(k){
      if (d[k] && typeof d[k] === 'object') s[k] = d[k];
    });
    if (typeof d.unita === 'string') s.unita = d.unita;
    if (d.pos && typeof d.pos === 'object' &&
        typeof d.pos.tx === 'number' && typeof d.pos.ty === 'number') s.pos = d.pos;
    return s;
  }

  function carica(){
    var raw = leggiGrezzo();
    if (!raw) return vuoto();
    try { return sanifica(JSON.parse(raw)); }
    catch(e){ return vuoto(); }
  }

  function salva(d){
    try { scriviGrezzo(JSON.stringify(d)); } catch(e){}
  }

  function esporta(d){
    try { return btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }
    catch(e){ return ''; }
  }
  function importa(codice){
    try { return sanifica(JSON.parse(decodeURIComponent(escape(atob(codice.trim())))));
    } catch(e){ return null; }
  }

  return { carica:carica, salva:salva, vuoto:vuoto, esporta:esporta,
           importa:importa, disponibile:disponibile };
})();

/* ══════════════════════════════════════════════════════════════════
   7. COMANDI — tastiera, croce direzionale, tocco diretto
   ══════════════════════════════════════════════════════════════════ */

var Input = (function(){
  var giu = {}, buffer = {}, tapId = null;
  var AREE = [], nAree = 0;
  for (var i=0;i<10;i++) AREE.push({x:0,y:0,w:0,h:0,id:null});

  var TASTI = {
    ArrowUp:'su', ArrowDown:'giu', ArrowLeft:'sx', ArrowRight:'dx',
    w:'su', s:'giu', a:'sx', d:'dx',
    W:'su', S:'giu', A:'sx', D:'dx',
    Enter:'a', ' ':'a', z:'a', Z:'a',
    Escape:'b', Backspace:'b', x:'b', X:'b',
    i:'album', I:'album', m:'mappa', M:'mappa',
    '1':'op1', '2':'op2', '3':'op3', '4':'op4'
  };
  // Tab NON è mai intercettato: serve alla navigazione da tastiera.

  function premi(nome){ if (!giu[nome]) buffer[nome] = true; giu[nome] = true; }
  function rilascia(nome){ giu[nome] = false; }

  window.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var nome = TASTI[e.key];
    if (!nome) return;
    e.preventDefault();
    premi(nome);
  }, {passive:false});

  window.addEventListener('keyup', function(e){
    var nome = TASTI[e.key];
    if (nome) rilascia(nome);
  });

  window.addEventListener('blur', function(){ giu = {}; });

  // Croce direzionale e tasti A/B
  function collega(el){
    var nome = el.getAttribute('data-t');
    function attiva(e){ e.preventDefault(); premi(nome); el.setAttribute('data-giu','1'); }
    function spegni(){ rilascia(nome); el.removeAttribute('data-giu'); }
    el.addEventListener('pointerdown', attiva);
    el.addEventListener('pointerup', spegni);
    el.addEventListener('pointercancel', spegni);
    el.addEventListener('pointerleave', spegni);
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#touch button'), collega);

  // Tocco diretto sul canvas: si converte in coordinate interne
  // e si confronta con le aree sensibili dichiarate dalla scena.
  function daSchermo(e){
    var cvs = elem('schermo'), r = cvs.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (LARG / r.width),
      y: (e.clientY - r.top)  * (ALT  / r.height)
    };
  }
  elem('schermo').addEventListener('pointerdown', function(e){
    e.preventDefault();
    var p = daSchermo(e);
    for (var i=0;i<nAree;i++){
      var a = AREE[i];
      if (p.x>=a.x && p.x<=a.x+a.w && p.y>=a.y && p.y<=a.y+a.h){ tapId = a.id; return; }
    }
    buffer.a = true;   // toccare altrove = "avanti", come premere A
  }, {passive:false});

  return {
    tenuto: function(n){ return !!giu[n]; },
    premuto: function(n){ if (buffer[n]){ buffer[n] = false; return true; } return false; },
    // Se il tasto è tenuto premuto vince quello; se invece è stato premuto
    // e rilasciato dentro lo stesso fotogramma (un tocco veloce, o una
    // tastiera automatica) il passo non va perso: resta nel buffer.
    direzione: function(){
      var d = null;
      if (giu.su) d = 'su';
      else if (giu.giu) d = 'giu';
      else if (giu.sx) d = 'sx';
      else if (giu.dx) d = 'dx';
      if (d){
        buffer.su = buffer.giu = buffer.sx = buffer.dx = false;
        return d;
      }
      var ordine = ['su','giu','sx','dx'];
      for (var i=0;i<4;i++){
        if (buffer[ordine[i]]){ buffer[ordine[i]] = false; return ordine[i]; }
      }
      return null;
    },
    azzeraAree: function(){ nAree = 0; },
    area: function(id,x,y,w,h){
      if (nAree >= AREE.length) return;
      var a = AREE[nAree++];
      a.id=id; a.x=x; a.y=y; a.w=w; a.h=h;
    },
    aree: function(){ return AREE.slice(0, nAree); },
    tap: function(){ var t = tapId; tapId = null; return t; },
    pulisci: function(){ buffer = {}; tapId = null; }
  };
})();

/* ══════════════════════════════════════════════════════════════════
   8. ELEMENTI DI INTERFACCIA
   ══════════════════════════════════════════════════════════════════
   Pannelli chiari con angoli tondi, un filo di ombra sotto e una
   sfumatura leggera: la cornice delle console a due schermi. */

var UI = {};

UI.box = function(g,x,y,w,h,sfondo,bordoCol){
  g.save();
  g.shadowColor = 'rgba(25,32,42,.35)';
  g.shadowBlur = 2.6; g.shadowOffsetY = 1.2;
  arrotondato(g,x,y,w,h,4.2);
  g.fillStyle = bordoCol || UIC.bordo;
  g.fill();
  g.restore();

  arrotondato(g,x+1.3,y+1.3,w-2.6,h-2.6,3.4);
  var gr = g.createLinearGradient(0,y,0,y+h);
  gr.addColorStop(0, sfondo || UIC.fondo);
  gr.addColorStop(1, sfondo || UIC.fondo2);
  g.fillStyle = gr; g.fill();

  // velo di luce solo sulla parte alta: dà il rilievo senza schiarire
  // i pannelli scuri, che altrimenti diventano metallici.
  g.save();
  arrotondato(g,x+1.3,y+1.3,w-2.6,h-2.6,3.4); g.clip();
  var gl = g.createLinearGradient(0,y,0,y+h*0.55);
  gl.addColorStop(0,'rgba(255,255,255,.42)');
  gl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gl; g.fillRect(x, y, w, h*0.55);
  g.restore();
};

UI.barra = function(g,x,y,w,h,frazione,colore,fondo){
  arrotondato(g,x-0.8,y-0.8,w+1.6,h+1.6,(h+1.6)/2);
  g.fillStyle = 'rgba(35,42,52,.85)'; g.fill();
  arrotondato(g,x,y,w,h,h/2);
  g.fillStyle = fondo || UIC.hpFondo; g.fill();
  var p = Math.max(0, Math.min(1, frazione));
  if (p > 0.02){
    arrotondato(g,x,y,Math.max(h,w*p),h,h/2);
    var gr = g.createLinearGradient(0,y,0,y+h);
    gr.addColorStop(0,'rgba(255,255,255,.55)');
    gr.addColorStop(0.45, colore);
    gr.addColorStop(1, colore);
    g.fillStyle = gr; g.fill();
  }
};

UI.barraPS = function(g,x,y,w,frazione){
  var col = frazione > 0.5 ? UIC.hpVerde : (frazione > 0.25 ? UIC.hpGiallo : UIC.hpRosso);
  UI.barra(g, x, y, w, 4.4, frazione, col, UIC.hpFondo);
};

UI.cuori = function(g,x,y,vite,max){
  for (var i=0;i<max;i++){
    var cx = x + i*8.5, pieno = i < vite;
    g.save();
    g.fillStyle = pieno ? '#e05a5a' : 'rgba(120,128,140,.45)';
    g.beginPath();
    g.moveTo(cx+3, y+6.4);
    g.bezierCurveTo(cx-0.6, y+3.4, cx+0.4, y+0.4, cx+3, y+2.1);
    g.bezierCurveTo(cx+5.6, y+0.4, cx+6.6, y+3.4, cx+3, y+6.4);
    g.closePath(); g.fill();
    if (pieno){ g.fillStyle='rgba(255,255,255,.5)'; ovale(g,cx+1.9,y+2.4,0.8,0.6); g.fill(); }
    g.restore();
  }
};

UI.cursore = function(g,x,y,tempo){
  var d = Math.sin(tempo/6)*0.7;
  g.save();
  g.fillStyle = '#d89a1e';
  g.beginPath();
  g.moveTo(x+2+d, y); g.lineTo(x+6.4+d, y+3.4); g.lineTo(x+2+d, y+6.8);
  g.closePath(); g.fill();
  g.restore();
};

UI.avanti = function(g,x,y,tempo){
  var d = (Math.floor(tempo/22) % 2) ? 0.8 : 0;
  g.save();
  g.fillStyle = '#7d8ea6';
  g.beginPath();
  g.moveTo(x, y+d); g.lineTo(x+6, y+d); g.lineTo(x+3, y+4.2+d);
  g.closePath(); g.fill();
  g.restore();
};

UI.lucchetto = function(g,x,y,colore){
  colore = colore || '#8b93a0';
  g.save();
  g.strokeStyle = colore; g.lineWidth = 1.2;
  g.beginPath(); g.arc(x+4, y+3.4, 2.2, 3.14, 6.28); g.stroke();
  g.fillStyle = colore;
  arrotondato(g, x+0.8, y+3.6, 6.4, 5.4, 1.2); g.fill();
  g.fillStyle = 'rgba(0,0,0,.35)'; ovale(g, x+4, y+6.1, 0.75, 0.9); g.fill();
  g.restore();
};

UI.medaglia = function(g,cx,cy,r,acceso){
  g.save();
  if (acceso){
    var al = g.createRadialGradient(cx,cy,r*0.3,cx,cy,r*1.9);
    al.addColorStop(0,'rgba(255,214,110,.55)'); al.addColorStop(1,'rgba(255,214,110,0)');
    g.fillStyle = al; ovale(g,cx,cy,r*1.9,r*1.9); g.fill();
  }
  var gr = g.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  if (acceso){ gr.addColorStop(0,'#ffe9a4'); gr.addColorStop(0.5,'#e8b93c'); gr.addColorStop(1,'#a97d18'); }
  else { gr.addColorStop(0,'#5a616e'); gr.addColorStop(1,'#3a404b'); }
  ovale(g,cx,cy,r,r); g.fillStyle = gr; g.fill();
  bordo(g, acceso ? '#8a6412' : '#2c313a', 1);
  if (acceso){
    g.fillStyle = 'rgba(255,255,255,.5)'; ovale(g,cx-r*0.3,cy-r*0.38,r*0.42,r*0.28); g.fill();
    g.fillStyle = '#8a6412';
    g.beginPath();
    for (var i=0;i<5;i++){
      var a1 = -1.5708 + i*1.2566, a2 = a1 + 0.6283;
      g.lineTo(cx+Math.cos(a1)*r*0.55, cy+Math.sin(a1)*r*0.55);
      g.lineTo(cx+Math.cos(a2)*r*0.24, cy+Math.sin(a2)*r*0.24);
    }
    g.closePath(); g.fill();
  } else {
    // Medaglia non ancora vinta: sagoma spenta, non un lucchetto — il
    // lucchetto vuol dire "zona chiusa", ed è un'altra cosa.
    g.fillStyle = 'rgba(255,255,255,.16)';
    g.beginPath();
    for (var j=0;j<5;j++){
      var b1 = -1.5708 + j*1.2566, b2 = b1 + 0.6283;
      g.lineTo(cx+Math.cos(b1)*r*0.55, cy+Math.sin(b1)*r*0.55);
      g.lineTo(cx+Math.cos(b2)*r*0.24, cy+Math.sin(b2)*r*0.24);
    }
    g.closePath(); g.fill();
  }
  g.restore();
};

// Pedana su cui stanno i due sfidanti in battaglia.
function piattaforma(g,cx,cy,rx,ry,colore,colore2){
  g.save();
  g.globalAlpha = 0.22; g.fillStyle = '#243318';
  ovale(g,cx,cy+1.6,rx+1.5,ry+1); g.fill();
  g.globalAlpha = 1;
  var gr = g.createLinearGradient(0,cy-ry,0,cy+ry);
  gr.addColorStop(0, colore);
  gr.addColorStop(1, colore2 || colore);
  g.fillStyle = gr; ovale(g,cx,cy,rx,ry); g.fill();
  g.fillStyle = 'rgba(255,255,255,.22)';
  ovale(g,cx,cy-ry*0.32,rx*0.72,ry*0.5); g.fill();
  g.restore();
}

/* ══════════════════════════════════════════════════════════════════
   9. STATO DEL GIOCO E PILA DELLE SCENE
   ══════════════════════════════════════════════════════════════════ */

var cvs = elem('schermo');
var g = cvs.getContext('2d');
g.imageSmoothingEnabled = false;

var Gioco = {
  dati:null, unita:null, save:null,
  player:{ tx:12, ty:29, dir:'giu', frame:0, passo:0, dirPasso:null, animo:0 },
  tempo:0, passiDaIncontro:0
};

Gioco.unitaPer = function(id){
  for (var i=0;i<Gioco.dati.unita.length;i++)
    if (Gioco.dati.unita[i].id === id) return Gioco.dati.unita[i];
  return null;
};
Gioco.giocabili = function(){
  return Gioco.dati.unita.filter(function(u){ return u.stato === 'giocabile'; });
};
Gioco.carteUnita = function(u){
  var out = [];
  (u.missioni||[]).forEach(function(m){
    (m.domande||[]).forEach(function(d){ if (d.carta) out.push(d.carta); });
    if (m.cartaBonus) out.push(m.cartaBonus);
  });
  if (u.boss) (u.boss.domande||[]).forEach(function(d){ if (d.carta) out.push(d.carta); });
  return out;
};
Gioco.carteTotali = function(){
  var n = 0;
  Gioco.giocabili().forEach(function(u){ n += Gioco.carteUnita(u).length; });
  return n;
};
Gioco.carteAvute = function(){
  var n = 0, s = Gioco.save.carte;
  Gioco.giocabili().forEach(function(u){
    Gioco.carteUnita(u).forEach(function(c){ if (s[c.id]) n++; });
  });
  return n;
};
Gioco.percentuale = function(){
  var t = Gioco.carteTotali();
  return t ? Gioco.carteAvute() / t : 0;
};
Gioco.missioniFatte = function(u){
  var n = 0;
  (u.missioni||[]).forEach(function(m){ if (Gioco.save.missioni[m.id]) n++; });
  return n;
};
Gioco.tutteFatte = function(u){
  return (u.missioni||[]).length > 0 && Gioco.missioniFatte(u) === u.missioni.length;
};
Gioco.salva = function(){
  Gioco.save.pos = {
    unita: Gioco.unita.id, tx: Gioco.player.tx, ty: Gioco.player.ty,
    firma: Mondo.firma
  };
  Save.salva(Gioco.save);
};

var Scene = {
  pila: [],
  push: function(s, arg){
    Scene.pila.push(s);
    Input.pulisci();
    if (s.entra) s.entra(arg);
  },
  pop: function(ris){
    var s = Scene.pila.pop();
    if (s && s.esce) s.esce();
    Input.pulisci();
    var sotto = Scene.cima();
    if (sotto && sotto.torna) sotto.torna(ris);
  },
  sostituisci: function(s, arg){
    var v = Scene.pila.pop();
    if (v && v.esce) v.esce();
    Scene.push(s, arg);
  },
  cima: function(){ return Scene.pila[Scene.pila.length-1]; }
};

/* ══════════════════════════════════════════════════════════════════
   10. AVVIO E CONTROLLO DEI CONTENUTI
   ══════════════════════════════════════════════════════════════════
   Il blocco dei contenuti è JSON inerte: un errore lì dentro non può
   rompere la pagina, e possiamo dire a schermo quale riga correggere. */

function mostraErrore(titolo, corpo){
  var box = elem('errore'), c = elem('errore-corpo');
  elem('errore').querySelector('h1').textContent = titolo;
  c.innerHTML = corpo;
  box.style.display = 'block';
}

function scappa(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function rigaDaPosizione(testo, pos){
  var n = 1;
  for (var i=0;i<pos && i<testo.length;i++) if (testo.charAt(i) === '\n') n++;
  return n;
}

function leggiContenuti(){
  var nodo = elem('dati');
  if (!nodo) throw { amichevole:'Manca il blocco dei contenuti nel file.' };
  var testo = nodo.textContent;
  try {
    return JSON.parse(testo);
  } catch(e){
    // Invece di un numero di riga da interpretare, si mostrano le righe vere
    // attorno al punto in cui il browser si è fermato: si cercano nel file
    // con un normale "trova" e si vede subito cosa manca.
    var m = /position (\d+)/.exec(e.message);
    var righe = testo.split('\n');
    var n = m ? rigaDaPosizione(testo, +m[1]) : 0;
    var contesto = '';
    if (n){
      for (var i = Math.max(1, n-2); i <= Math.min(righe.length, n+1); i++){
        contesto += (i === n ? '➜ ' : '  ') + righe[i-1] + '\n';
      }
    }
    throw { amichevole:
      '<p>C\'è un errore di scrittura nel blocco dei contenuti, in cima al file. ' +
      'Il browser si è fermato qui:</p>' +
      (contesto ? '<pre>' + scappa(contesto) + '</pre>' : '') +
      '<p><b>Quasi sempre il problema è sulla riga appena sopra la freccia</b>: ' +
      'una <b>virgola mancante</b> alla fine, oppure una <b>virgola di troppo</b> ' +
      'prima di una parentesi chiusa. Altre cause frequenti: una virgoletta " ' +
      'dimenticata, o delle <b>virgolette curve</b> “ ” incollate da Word.</p>' +
      '<p>Cerca quelle righe nel file con "Trova", correggi e ricarica la pagina.</p>' +
      '<pre>' + scappa(e.message) + '</pre>' };
  }
}

var LIM_DOMANDA = 110, LIM_OPZIONE = 68;

function controlla(dati){
  var errori = [];
  function E(dove, cosa){ errori.push('<b>' + scappa(dove) + '</b> — ' + cosa); }

  if (!dati || typeof dati !== 'object') { E('contenuti','il blocco non contiene un oggetto.'); return errori; }
  if (!Array.isArray(dati.unita) || !dati.unita.length){
    E('unita','manca la lista delle unità, oppure è vuota.'); return errori;
  }

  var idVisti = {};
  dati.unita.forEach(function(u, iu){
    var dove = 'unità ' + (u.numero || (iu+1)) + ' (' + (u.id || 'senza id') + ')';
    if (!u.id) E(dove, 'manca il campo "id".');
    else if (idVisti[u.id]) E(dove, 'l\'id "' + scappa(u.id) + '" è usato due volte.');
    else idVisti[u.id] = true;
    if (!u.titolo) E(dove, 'manca il "titolo".');
    if (u.stato !== 'giocabile' && u.stato !== 'inArrivo')
      E(dove, 'il campo "stato" deve essere "giocabile" oppure "inArrivo".');
    if (u.stato !== 'giocabile') return;

    if (!Array.isArray(u.missioni) || !u.missioni.length)
      E(dove, 'è "giocabile" ma non ha nessuna missione.');

    function controllaDomanda(d, dove2){
      if (!d.testo) { E(dove2, 'manca il "testo" della domanda.'); return; }
      if (d.testo.length > LIM_DOMANDA)
        E(dove2, 'la domanda è lunga ' + d.testo.length + ' caratteri, il massimo è ' +
          LIM_DOMANDA + '. Accorciala.');
      if (!Array.isArray(d.opzioni) || d.opzioni.length !== 4)
        E(dove2, 'servono esattamente 4 opzioni di risposta.');
      else d.opzioni.forEach(function(o, i){
        if (typeof o !== 'string' || !o) E(dove2, 'l\'opzione ' + (i+1) + ' è vuota.');
        else if (o.length > LIM_OPZIONE)
          E(dove2, 'l\'opzione ' + (i+1) + ' è lunga ' + o.length +
            ' caratteri, il massimo è ' + LIM_OPZIONE + ': «' + scappa(o) + '»');
      });
      if (!(d.risposta >= 1 && d.risposta <= 4))
        E(dove2, '"risposta" deve essere 1, 2, 3 o 4 (adesso vale ' + scappa(d.risposta) + ').');
      if (!d.spiegazione) E(dove2, 'manca la "spiegazione": è il pezzo che fa imparare.');
      if (d.perche_no && (!Array.isArray(d.perche_no) || d.perche_no.length !== 4))
        E(dove2, '"perche_no" deve avere esattamente 4 voci, una per opzione.');
      if (!d.carta || !d.carta.id || !d.carta.titolo)
        E(dove2, 'manca la "carta" (servono almeno "id" e "titolo").');
    }

    (u.missioni||[]).forEach(function(m, im){
      var dm = dove + ' · missione ' + (im+1) + ' (' + (m.titolo || 'senza titolo') + ')';
      if (!m.id) E(dm, 'manca il campo "id".');
      if (!Array.isArray(m.domande) || !m.domande.length) E(dm, 'non ha domande.');
      (m.domande||[]).forEach(function(d, id){ controllaDomanda(d, dm + ' · domanda ' + (id+1)); });
    });

    if (!u.boss) E(dove, 'manca il boss di fine unità.');
    else {
      if (!Array.isArray(u.boss.domande) || !u.boss.domande.length)
        E(dove + ' · boss', 'non ha domande.');
      (u.boss.domande||[]).forEach(function(d, id){
        controllaDomanda(d, dove + ' · boss · domanda ' + (id+1));
      });
    }
    if (!u.medaglia || !u.medaglia.id) E(dove, 'manca la "medaglia".');
  });

  return errori;
}

/* ══════════════════════════════════════════════════════════════════
   11. SCALA DELLO SCHERMO
   ══════════════════════════════════════════════════════════════════
   Si disegna sempre in unità di gioco (320x208), ma la tela ha la
   risoluzione vera dello schermo: il browser smussa tutto e non si
   vedono più i quadretti. */

function ridimensiona(){
  var vp = elem('viewport');
  var wCss = vp.clientWidth, hCss = vp.clientHeight;
  if (!wCss || !hCss) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);

  var s = Math.min(wCss / LARG, hCss / ALT);
  var cw = Math.max(1, Math.round(LARG * s));
  var ch = Math.max(1, Math.round(ALT * s));
  cvs.style.width = cw + 'px';
  cvs.style.height = ch + 'px';

  var pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
  if (cvs.width !== pw || cvs.height !== ph){ cvs.width = pw; cvs.height = ph; }

  // Assegnare width azzera lo stato del contesto: si rimette ogni volta.
  g.setTransform(pw / LARG, 0, 0, ph / ALT, 0, 0);
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  g.lineJoin = 'round';
  g.lineCap = 'round';
}

var scenaTitolo = {
  entra: function(){ this.t = 0; },
  agg: function(){ this.t++; },
  input: function(){

  dis: function(gg){

    // cielo a bande
